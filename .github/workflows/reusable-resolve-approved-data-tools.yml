name: Resolve Approved Data Tools

on:
  workflow_call:
    outputs:
      source_sha:
        value: ${{ jobs.resolve.outputs.source_sha }}
      data_tools_image:
        value: ${{ jobs.resolve.outputs.data_tools_image }}
    secrets:
      SERVER_IP:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.approved.outputs.source_sha }}
      data_tools_image: ${{ steps.approved.outputs.data_tools_image }}
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: www

    steps:
      - name: Configure read-only deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Resolve approved generator release
        id: approved
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cat /srv/wcarankings/server-release-state.json' \
            > /tmp/approved-server-release.json
          source_sha=$(jq -r '.sourceSha' /tmp/approved-server-release.json)
          data_tools_image=$(jq -r '.dataToolsImage' /tmp/approved-server-release.json)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$data_tools_image" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "data_tools_image=$data_tools_image" >> "$GITHUB_OUTPUT"
          {
            echo "### Approved data tools"
            echo "- Source: $source_sha"
            echo "- Image: $data_tools_image"
            echo "- Scheduled runs do not select generator code from current main."
          } >> "$GITHUB_STEP_SUMMARY"
