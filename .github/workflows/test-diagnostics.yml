name: Test Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/projection-pipeline-performance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply literal dependency and assertion fixes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const groupsPath = 'scripts/projection-groups.mjs';
          const groupLines = (await readFile(groupsPath, 'utf8')).split('\n');
          const cityStart = groupLines.findIndex((line) => line.includes('name: "city-rankings"'));
          const dependencyIndex = groupLines.findIndex(
            (line, index) => index > cityStart && line.includes('dependencies:'),
          );
          const indent = groupLines[dependencyIndex].match(/^\s*/)[0];
          groupLines[dependencyIndex] = `${indent}dependencies: ["result-facts", "competition-rankings"],`;
          await writeFile(groupsPath, groupLines.join('\n'));

          const deployTestPath = 'tests/deploy-workflow.test.mjs';
          let deployTest = await readFile(deployTestPath, 'utf8');
          deployTest = deployTest.replaceAll('WCA export identity', 'Projection export identity');
          await writeFile(deployTestPath, deployTest);

          const resultTestPath = 'tests/result-projections.test.mjs';
          let resultTest = await readFile(resultTestPath, 'utf8');
          resultTest = resultTest
            .replaceAll(
              'PARTITION BY r\\.event_id, r\\.person_id, COALESCE\\(r\\.person_country_id',
              'PARTITION BY historical\\.event_id, historical\\.person_id, COALESCE\\(historical\\.person_country_id',
            )
            .replaceAll(
              'PARTITION BY r\\.event_id, r\\.person_id, r\\.person_continent_id',
              'PARTITION BY historical\\.event_id, historical\\.person_id, historical\\.person_continent_id',
            );
          await writeFile(resultTestPath, resultTest);
          NODE
      - name: Report remaining failure metadata
        run: |
          cat > /tmp/failure-reporter.mjs <<'REPORTER'
          export default async function* failureReporter(source) {
            for await (const event of source) {
              if (event.type !== 'test:fail') continue;
              const error = event.data.details?.error || {};
              const actual = typeof error.actual === 'string'
                ? error.actual.slice(0, 500)
                : error.actual;
              const expected = typeof error.expected === 'string'
                ? error.expected.slice(0, 500)
                : error.expected;
              yield `${JSON.stringify({
                name: event.data.name,
                operator: error.operator,
                expected,
                actual,
                stack: String(error.stack || '').split('\n').filter((line) => line.includes('/tests/')).slice(0, 3),
              }, null, 2)}\n`;
            }
          }
          REPORTER
          set +e
          failed=0
          for test_file in \
            tests/deploy-workflow.test.mjs \
            tests/projection-release-plan.test.mjs \
            tests/result-projections.test.mjs; do
            echo "===== $test_file ====="
            node --test --test-reporter=/tmp/failure-reporter.mjs "$test_file"
            status=$?
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
