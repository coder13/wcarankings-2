name: Test Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/projection-pipeline-performance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact dependency and assertion fixes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const groupsPath = 'scripts/projection-groups.mjs';
          const groupLines = (await readFile(groupsPath, 'utf8')).split('\n');
          const cityStart = groupLines.findIndex((line) => line.includes('name: "city-rankings"'));
          if (cityStart < 0) throw new Error('city-rankings group not found');
          const dependencyIndex = groupLines.findIndex(
            (line, index) => index > cityStart && line.includes('dependencies:'),
          );
          if (dependencyIndex < 0) throw new Error('city-rankings dependencies not found');
          const indent = groupLines[dependencyIndex].match(/^\s*/)[0];
          groupLines[dependencyIndex] = `${indent}dependencies: ["result-facts", "competition-rankings"],`;
          await writeFile(groupsPath, groupLines.join('\n'));

          const deployTestPath = 'tests/deploy-workflow.test.mjs';
          const deployLines = (await readFile(deployTestPath, 'utf8')).split('\n');
          let deployChanged = false;
          for (let index = 0; index < deployLines.length; index += 1) {
            if (deployLines[index].includes('WCA export identity')) {
              deployLines[index] = deployLines[index].replace(
                'WCA export identity',
                'Projection export identity',
              );
              deployChanged = true;
            }
          }
          if (!deployChanged) throw new Error('WCA export identity assertion not found');
          await writeFile(deployTestPath, deployLines.join('\n'));

          const resultTestPath = 'tests/result-projections.test.mjs';
          const resultLines = (await readFile(resultTestPath, 'utf8')).split('\n');
          let nationalityChanged = 0;
          for (let index = 0; index < resultLines.length; index += 1) {
            if (resultLines[index].includes('PARTITION BY r\\.event_id, r\\.person_id')) {
              resultLines[index] = resultLines[index]
                .replaceAll('r\\.event_id', 'historical\\.event_id')
                .replaceAll('r\\.person_id', 'historical\\.person_id')
                .replaceAll('r\\.person_country_id', 'historical\\.person_country_id')
                .replaceAll('r\\.person_continent_id', 'historical\\.person_continent_id');
              nationalityChanged += 1;
            }
          }
          if (nationalityChanged < 2) {
            throw new Error(`Expected two historical nationality assertions; changed ${nationalityChanged}`);
          }
          await writeFile(resultTestPath, resultLines.join('\n'));
          NODE

          grep -A4 -B1 'name: "city-rankings"' scripts/projection-groups.mjs
          grep -n 'Projection export identity' tests/deploy-workflow.test.mjs
          grep -n 'PARTITION BY historical\\.event_id' tests/result-projections.test.mjs
      - name: Run corrected projection tests
        run: |
          node --test \
            tests/deploy-workflow.test.mjs \
            tests/projection-release-plan.test.mjs \
            tests/result-projections.test.mjs
      - name: Commit corrected source and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/projection-groups.mjs tests/deploy-workflow.test.mjs tests/result-projections.test.mjs
          git commit -m 'Fix projection dependency closure and expectations'
          git push origin HEAD:agent/projection-pipeline-performance
