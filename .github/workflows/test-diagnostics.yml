name: Test Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/projection-pipeline-performance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show checkout identity and test sources
        run: |
          git rev-parse HEAD
          grep -R -n "projection workflow treats WCA export timestamps as exact identities" tests || true
          grep -R -n "explicit group selection expands required dependencies" tests || true
          grep -R -n "ranking entry sources use historical result nationality" tests || true
          grep -n "PARTITION BY r.event_id, r.person_id" sql/ranking-projections/ranking_entries_*_source.sql
      - name: Run projection tests against branch head
        run: |
          node --test \
            tests/deploy-workflow.test.mjs \
            tests/projection-release-plan.test.mjs \
            tests/result-projections.test.mjs
