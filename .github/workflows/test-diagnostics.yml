name: Test Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Show compact remaining failures
        run: |
          set +e
          failed=0
          for test_file in \
            tests/deploy-workflow.test.mjs \
            tests/projection-release-plan.test.mjs \
            tests/result-projections.test.mjs; do
            output=$(mktemp)
            node --test --test-reporter=tap "$test_file" >"$output" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              failed=1
              echo "===== FAILED: $test_file ====="
              awk '
                /^not ok / { printing=1; remaining=45 }
                printing { print; remaining-- }
                printing && remaining <= 0 { printing=0 }
              ' "$output"
            fi
            rm -f "$output"
          done
          exit "$failed"
