name: Test Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run test files independently
        run: |
          set +e
          failed=0
          for test_file in \
            tests/chunk-projection-dump.test.mjs \
            tests/cloudflare-cache-rule.test.mjs \
            tests/database-timeout.test.mjs \
            tests/deploy-workflow.test.mjs \
            tests/person-lookup-index.integration.mjs \
            tests/projection-release-artifact.test.mjs \
            tests/projection-release-plan.test.mjs \
            tests/ranking-generation-activation.test.mjs \
            tests/release-compatibility.test.mjs \
            tests/projection-transfer.test.mjs \
            tests/rendered-html.test.mjs \
            tests/scroll-engine.test.mjs \
            tests/result-projections.test.mjs \
            tests/projection-architecture.test.mjs \
            tests/projection-scheduler.test.mjs; do
            output=$(mktemp)
            node --test "$test_file" >"$output" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              failed=1
              echo "FAILED: $test_file"
              grep -E '^(not ok|# (AssertionError|Error|Subtest:)|  (expected|actual|operator):)' "$output" | tail -n 80 || tail -n 80 "$output"
            fi
            rm -f "$output"
          done
          exit "$failed"
