name: Deploy Ranking Generation

on:
  workflow_call:
    inputs:
      ref:
        description: Approved source SHA containing release tooling.
        required: true
        type: string
      artifact_name:
        description: Projection release workflow artifact name.
        required: true
        type: string
      artifact_run_id:
        description: Originating workflow run ID.
        required: true
        type: string
      artifact_id:
        description: Immutable GitHub artifact ID.
        required: true
        type: string
      manifest_sha256:
        description: Expected projection release manifest SHA-256.
        required: true
        type: string
      groups:
        description: Comma-separated canonical projection group names.
        required: true
        type: string
      export_date:
        description: YYYY-MM-DD WCA export cache date.
        required: true
        type: string
      export_value:
        description: Target WCA export identity.
        required: true
        type: string
      production_export_value:
        description: WCA export identity observed during planning.
        required: true
        type: string
      source_sha:
        description: Approved source SHA that generated the release.
        required: true
        type: string
      data_tools_image:
        description: Approved digest-qualified data-tools image.
        required: true
        type: string
      failure_injection_point:
        description: Test-only failure boundary.
        required: false
        default: ""
        type: string
    secrets:
      SERVER_IP:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.repository == 'coder13/wcarankings-2'
      && inputs.groups != ''
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: www
      PROJECTION_ARTIFACT_DIR: /tmp/projection-release
      PROJECTION_GROUPS: ${{ inputs.groups }}
      WCA_EXPORT_DATE: ${{ inputs.export_date }}
      WCA_EXPORT_VALUE: ${{ inputs.export_value }}
      PRODUCTION_WCA_EXPORT_VALUE: ${{ inputs.production_export_value }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      DATA_TOOLS_IMAGE: ${{ inputs.data_tools_image }}
      FAILURE_INJECTION_POINT: ${{ inputs.failure_injection_point }}

    steps:
      - name: Check out approved release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Validate immutable release coordinates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$DATA_TOOLS_IMAGE" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
          [[ "$WCA_EXPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$WCA_EXPORT_VALUE" =~ ^[0-9TZUTC:+.\ -]+$ ]]
          [[ "$PRODUCTION_WCA_EXPORT_VALUE" =~ ^[0-9TZUTC:+.\ -]+$ ]]
          for group in $(printf '%s' "$PROJECTION_GROUPS" | tr ',' ' '); do
            case "$group" in
              core|sum-of-ranks|yearly-person-rankings) ;;
              *) echo "Unknown projection group: $group" >&2; exit 1 ;;
            esac
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > /tmp/artifact-coordinate.json
          jq -e \
            --arg name "$ARTIFACT_NAME" \
            --argjson run "$ARTIFACT_RUN_ID" \
            '.name == $name and .workflow_run.id == $run and .expired == false' \
            /tmp/artifact-coordinate.json >/dev/null

      - name: Download exact projection release
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/projection-release

      - name: Verify projection release integrity and compatibility
        env:
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          node scripts/projection-release-artifact.mjs verify \
            --directory="$PROJECTION_ARTIFACT_DIR" \
            --sha256="$EXPECTED_MANIFEST_SHA256" \
            --groups="$PROJECTION_GROUPS" \
            --export-id="$WCA_EXPORT_VALUE" \
            --source-sha="$EXPECTED_SOURCE_SHA"
          if [ "$WCA_EXPORT_VALUE" != "$PRODUCTION_WCA_EXPORT_VALUE" ]; then
            jq -e '.raw != null' "$PROJECTION_ARTIFACT_DIR/projection-release.json" >/dev/null
          fi
          jq -e \
            --slurpfile compatibility release-compatibility.json \
            '.compatibility.artifactFormatVersion == $compatibility[0].artifactFormatVersion
             and .compatibility.datasetSchemaVersion == $compatibility[0].datasetSchemaVersion' \
            "$PROJECTION_ARTIFACT_DIR/projection-release.json" >/dev/null

      - name: Pull approved data-tools image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify and transfer approved data tools
        run: |
          docker pull "$DATA_TOOLS_IMAGE"
          test "$(docker image inspect "$DATA_TOOLS_IMAGE" --format '{{index .RepoDigests 0}}')" \
            = "$DATA_TOOLS_IMAGE"
          docker run --rm --entrypoint sh "$DATA_TOOLS_IMAGE" -c \
            'test -f /app/release-compatibility.json && test -f /app/scripts/activate-ranking-generation.mjs'
          docker run --rm --entrypoint cat "$DATA_TOOLS_IMAGE" \
            /app/release-compatibility.json > /tmp/data-tools-compatibility.json
          jq -e \
            --slurpfile manifest "$PROJECTION_ARTIFACT_DIR/projection-release.json" \
            '.artifactFormatVersion == $manifest[0].compatibility.artifactFormatVersion
             and .datasetSchemaVersion == $manifest[0].compatibility.datasetSchemaVersion' \
            /tmp/data-tools-compatibility.json >/dev/null
          docker tag "$DATA_TOOLS_IMAGE" "wcarankings-data-tools:artifact-${ARTIFACT_ID}"
          docker save "wcarankings-data-tools:artifact-${ARTIFACT_ID}" \
            | gzip -1 \
            | ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" 'gzip -d | docker load'
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "docker tag 'wcarankings-data-tools:artifact-${ARTIFACT_ID}' wcarankings-data-tools:latest"

      - name: Check remote transfer capacity
        run: |
          release_bytes=$(jq \
            '[.raw?.bytes // 0, (.groups[].archive.bytes)] | add' \
            "$PROJECTION_ARTIFACT_DIR/projection-release.json")
          required_kib=$((release_bytes / 1024 * 2 + 102400))
          available_kib=$(ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "df -Pk /tmp | awk 'NR == 2 { print \$4 }'")
          if [ "$available_kib" -lt "$required_kib" ]; then
            echo "Remote /tmp has ${available_kib} KiB; at least ${required_kib} KiB is required." >&2
            exit 1
          fi
          required_db_kib=$((release_bytes / 1024 * 5 + 1048576))
          available_db_kib=$(ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "cd /srv/wcarankings && docker compose exec -T db \
              df -Pk /var/lib/mysql | awk 'NR == 2 { print \$4 }'")
          if [ "$available_db_kib" -lt "$required_db_kib" ]; then
            echo "MariaDB storage has ${available_db_kib} KiB; at least ${required_db_kib} KiB is required for candidate and rollback tables." >&2
            exit 1
          fi

      - name: Upload verified generation bundle
        run: |
          for group in $(printf '%s' "$PROJECTION_GROUPS" | tr ',' ' '); do
            archive=$(jq -r --arg group "$group" '.groups[$group].archive.file' \
              "$PROJECTION_ARTIFACT_DIR/projection-release.json")
            prefix=$group
            if [ "$group" = yearly-person-rankings ]; then prefix=yearly; fi
            scp -q -o BatchMode=yes "$PROJECTION_ARTIFACT_DIR/$archive" \
              "$SERVER_USER@$SERVER_IP:/tmp/wcarankings-${ARTIFACT_ID}-${prefix}.sql.gz"
          done
          raw_file=$(jq -r '.raw.file // empty' \
            "$PROJECTION_ARTIFACT_DIR/projection-release.json")
          if [ -n "$raw_file" ]; then
            scp -q -o BatchMode=yes "$PROJECTION_ARTIFACT_DIR/$raw_file" \
              "$SERVER_USER@$SERVER_IP:/tmp/wcarankings-${ARTIFACT_ID}-raw.sql.zip"
          fi
          scp -q -o BatchMode=yes \
            "$PROJECTION_ARTIFACT_DIR/projection-release.json" \
            "$SERVER_USER@$SERVER_IP:/tmp/wcarankings-${ARTIFACT_ID}-release.json"

      - name: Prepare and atomically activate ranking generation
        id: generation-activation
        run: |
          started_at=$(date +%s)
          has_raw=$(jq -r '.raw != null' \
            "$PROJECTION_ARTIFACT_DIR/projection-release.json")
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "ARTIFACT_ID='$ARTIFACT_ID' \
             ARTIFACT_RUN_ID='$ARTIFACT_RUN_ID' \
             PROJECTION_GROUPS='$PROJECTION_GROUPS' \
             WCA_EXPORT_VALUE='$WCA_EXPORT_VALUE' \
             HAS_RAW='$has_raw' \
             FAILURE_INJECTION_POINT='$FAILURE_INJECTION_POINT' sh -s" <<'REMOTE'
            set -eu
            cd /srv/wcarankings
            exec 9>/srv/wcarankings/production-mutation.lock
            if ! flock -w 60 9; then
              echo "Another server-side production mutation holds the lock." >&2
              exit 1
            fi
            docker compose run --rm data-tools /app/scripts/prepare-flyway-history.mjs

            candidate="wcarankings_candidate_${ARTIFACT_ID}"
            previous="${candidate}_previous"
            phase_file="/srv/wcarankings/projection-deploy-${ARTIFACT_ID}.phase"
            release_file="/tmp/wcarankings-${ARTIFACT_ID}-release.json"
            phase=$(cat "$phase_file" 2>/dev/null || printf "none")
            activated=false
            heartbeat_pid=

            cleanup_files() {
              rm -f \
                "/tmp/wcarankings-${ARTIFACT_ID}-core.sql.gz" \
                "/tmp/wcarankings-${ARTIFACT_ID}-sum-of-ranks.sql.gz" \
                "/tmp/wcarankings-${ARTIFACT_ID}-yearly.sql.gz" \
                "/tmp/wcarankings-${ARTIFACT_ID}-raw.sql.zip" \
                "$release_file"
            }
            rollback_on_failure() {
              status=$?
              if [ -n "$heartbeat_pid" ]; then kill "$heartbeat_pid" 2>/dev/null || true; fi
              if [ "$status" -ne 0 ]; then
                echo "Generation deployment failed; checking whether activation must be rolled back." >&2
                if docker compose run --rm -T data-tools \
                  /app/scripts/activate-ranking-generation.mjs rollback \
                  --candidate-schema="$candidate" \
                  --artifact-id="$ARTIFACT_ID"; then
                  printf "projections_prepared\n" > "$phase_file"
                fi
              fi
              cleanup_files
              exit "$status"
            }
            trap rollback_on_failure EXIT
            (while sleep 30; do echo "Ranking generation deployment is still running…"; done) &
            heartbeat_pid=$!

            reset_candidate() {
              docker compose exec -T \
                -e CANDIDATE_SCHEMA="$candidate" \
                -e PREVIOUS_SCHEMA="$previous" \
                db sh -c '
                  mariadb --user=root --password="$MARIADB_ROOT_PASSWORD" --execute="
                    DROP DATABASE IF EXISTS \`$CANDIDATE_SCHEMA\`;
                    DROP DATABASE IF EXISTS \`$PREVIOUS_SCHEMA\`;
                    CREATE DATABASE \`$CANDIDATE_SCHEMA\`;
                    CREATE DATABASE \`$PREVIOUS_SCHEMA\`;
                    GRANT ALL PRIVILEGES ON \`$CANDIDATE_SCHEMA\`.* TO \`$MARIADB_USER\`@\`%\`;
                    GRANT ALL PRIVILEGES ON \`$PREVIOUS_SCHEMA\`.* TO \`$MARIADB_USER\`@\`%\`;
                  "
                '
              docker compose run --rm \
                -e FLYWAY_URL="jdbc:mariadb://db:3306/${candidate}" \
                -e FLYWAY_TABLE=flyway_schema_history_app \
                flyway migrate
              docker compose run --rm \
                -e FLYWAY_URL="jdbc:mariadb://db:3306/${candidate}" \
                -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
                -e FLYWAY_TABLE=flyway_schema_history_results \
                flyway migrate
              printf "initialized\n" > "$phase_file"
              phase=initialized
            }

            case "$phase" in
              raw_prepared|projections_prepared|activated) ;;
              *) reset_candidate ;;
            esac

            if [ "$phase" = initialized ]; then
              if [ "$HAS_RAW" = true ]; then
                docker compose run --rm -T --entrypoint sh data-tools -c \
                  "cat > /var/cache/wcarankings/wca-export-${ARTIFACT_ID}.sql.zip" \
                  < "/tmp/wcarankings-${ARTIFACT_ID}-raw.sql.zip"
                docker compose run --rm \
                  -e DATABASE_NAME_OVERRIDE="$candidate" \
                  data-tools /app/scripts/sync-wca-export.mjs \
                    --force \
                    --raw-only \
                    --sql-path="/var/cache/wcarankings/wca-export-${ARTIFACT_ID}.sql.zip"
              else
                docker compose exec -T \
                  -e CANDIDATE_SCHEMA="$candidate" \
                  db sh -c '
                    mariadb --user=root --password="$MARIADB_ROOT_PASSWORD" --execute="
                      INSERT INTO \`$CANDIDATE_SCHEMA\`.export_metadata
                      SELECT * FROM \`$MARIADB_DATABASE\`.export_metadata
                      ON DUPLICATE KEY UPDATE value = VALUES(value);
                    "
                  '
              fi
              printf "raw_prepared\n" > "$phase_file"
              phase=raw_prepared
              if [ "$FAILURE_INJECTION_POINT" = after_raw_import ]; then
                echo "Injected failure after raw import." >&2
                exit 1
              fi
            fi

            if [ "$phase" = raw_prepared ]; then
              imported=0
              for group in $(printf '%s' "$PROJECTION_GROUPS" | tr ',' ' '); do
                prefix=$group
                if [ "$group" = yearly-person-rankings ]; then prefix=yearly; fi
                gzip -t "/tmp/wcarankings-${ARTIFACT_ID}-${prefix}.sql.gz"
                gzip -dc "/tmp/wcarankings-${ARTIFACT_ID}-${prefix}.sql.gz" \
                  | docker compose exec -T \
                      -e CANDIDATE_SCHEMA="$candidate" \
                      db sh -c '
                        mariadb --user="$MARIADB_USER" --password="$MARIADB_PASSWORD" "$CANDIDATE_SCHEMA"
                      '
                imported=$((imported + 1))
                if [ "$FAILURE_INJECTION_POINT" = during_projection_import ] \
                  && [ "$imported" -eq 1 ]; then
                  echo "Injected failure during projection import." >&2
                  exit 1
                fi
              done
              docker compose run --rm \
                -e DATABASE_NAME_OVERRIDE="$candidate" \
                data-tools /app/scripts/publish-projection-transfer.mjs \
                  --prepare-only \
                  --expected-export-date="$WCA_EXPORT_VALUE" \
                  --groups="$PROJECTION_GROUPS"
              docker compose run --rm \
                -e DATABASE_NAME_OVERRIDE="$candidate" \
                data-tools /app/scripts/publish-projection-transfer.mjs \
                  --groups="$PROJECTION_GROUPS"
              if [ "$PROJECTION_GROUPS" = "core,sum-of-ranks,yearly-person-rankings" ]; then
                docker compose run --rm \
                  -e DATABASE_NAME_OVERRIDE="$candidate" \
                  data-tools /app/scripts/check-ranking-projections.mjs
              fi
              printf "projections_prepared\n" > "$phase_file"
              phase=projections_prepared
            fi

            if [ "$phase" = projections_prepared ]; then
              docker compose run --rm -T \
                -e FAILURE_INJECTION_POINT="$FAILURE_INJECTION_POINT" \
                data-tools /app/scripts/activate-ranking-generation.mjs activate \
                  --candidate-schema="$candidate" \
                  --artifact-run-id="$ARTIFACT_RUN_ID" \
                  --artifact-id="$ARTIFACT_ID" \
                  --manifest=- \
                < "$release_file"
              printf "activated\n" > "$phase_file"
              phase=activated
            fi

            if [ "$FAILURE_INJECTION_POINT" = after_projection_activation_before_smoke ]; then
              echo "Injected failure after activation and before smoke verification." >&2
              exit 1
            fi

            docker compose run --rm data-tools \
              /app/scripts/check-ranking-projections.mjs

            retry_endpoint() {
              endpoint=$1
              attempt=1
              while [ "$attempt" -le 10 ]; do
                if curl --fail --silent --show-error --max-time 15 \
                  "http://127.0.0.1:3000${endpoint}" >/dev/null; then
                  return 0
                fi
                echo "Generation smoke check failed for $endpoint ($attempt/10)." >&2
                attempt=$((attempt + 1))
                sleep 3
              done
              return 1
            }
            retry_endpoint "/api/health/ready"
            retry_endpoint "/api/rankings?eventId=333&result=single&year=2024&start=0&limit=1&paged=1"
            retry_endpoint "/api/rankings?eventId=SOR&result=single&start=0&limit=10"
            retry_endpoint "/api/rankings/competitions?ranking=competitor-count&start=0&limit=10"

            docker compose exec -T \
              -e CANDIDATE_SCHEMA="$candidate" \
              -e PREVIOUS_SCHEMA="$previous" \
              db sh -c '
                mariadb --user=root --password="$MARIADB_ROOT_PASSWORD" --execute="
                  DROP DATABASE IF EXISTS \`$PREVIOUS_SCHEMA\`;
                  DROP DATABASE IF EXISTS \`$CANDIDATE_SCHEMA\`;
                "
              '
            rm -f "$phase_file"
            activated=true
            trap - EXIT
            kill "$heartbeat_pid" 2>/dev/null || true
            cleanup_files
          REMOTE
          completed_at=$(date +%s)
          duration=$((completed_at - started_at))
          echo "duration_seconds=$duration" >> "$GITHUB_OUTPUT"
          {
            echo "### Ranking generation activation"
            echo "- Artifact: $ARTIFACT_ID from workflow run $ARTIFACT_RUN_ID"
            echo "- WCA export: $WCA_EXPORT_VALUE"
            echo "- Groups: $PROJECTION_GROUPS"
            echo "- Prepare, atomic activation, and smoke verification: ${duration}s"
            echo "- Application and Caddy containers were not restarted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh database-backed system lists
        if: success()
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cd /srv/wcarankings && docker compose run --rm data-tools \
              /app/scripts/refresh-system-lists.mjs'

      - name: Refresh WCA Board list
        if: success()
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cd /srv/wcarankings && docker compose run --rm data-tools \
              /app/scripts/refresh-board-list.mjs'

      - name: Refresh WCA Delegates list
        if: success()
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cd /srv/wcarankings && docker compose run --rm data-tools \
              /app/scripts/refresh-board-list.mjs --delegates'

      - name: Capture failed generation diagnostics
        if: failure()
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cd /srv/wcarankings && docker compose ps && docker compose logs --tail=200 app db'
