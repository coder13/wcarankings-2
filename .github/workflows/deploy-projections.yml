name: Deploy Ranking Generation

on:
  workflow_call:
    inputs:
      ref:
        description: Approved source SHA containing release tooling.
        required: true
        type: string
      artifact_name:
        description: Projection release workflow artifact name.
        required: true
        type: string
      artifact_run_id:
        description: Originating workflow run ID.
        required: true
        type: string
      artifact_id:
        description: Immutable GitHub artifact ID.
        required: true
        type: string
      manifest_sha256:
        description: Expected projection release manifest SHA-256.
        required: true
        type: string
      groups:
        description: Comma-separated canonical projection group names.
        required: true
        type: string
      export_date:
        description: YYYY-MM-DD WCA export cache date.
        required: true
        type: string
      export_value:
        description: Target WCA export identity.
        required: true
        type: string
      production_export_value:
        description: WCA export identity observed during supersession check.
        required: true
        type: string
      source_sha:
        description: Approved source SHA that generated the release.
        required: true
        type: string
      data_tools_image:
        description: Approved digest-qualified data-tools image.
        required: true
        type: string
      flyway_image:
        description: Approved digest-qualified Flyway image.
        required: true
        type: string
      failure_injection_point:
        description: Test-only failure boundary.
        required: false
        default: ""
        type: string
    secrets:
      SERVER_IP:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.repository == 'coder13/wcarankings-2'
      && inputs.groups != ''
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: www
      PROJECTION_ARTIFACT_DIR: /tmp/projection-release
      PROJECTION_GROUPS: ${{ inputs.groups }}
      WCA_EXPORT_DATE: ${{ inputs.export_date }}
      WCA_EXPORT_VALUE: ${{ inputs.export_value }}
      PRODUCTION_WCA_EXPORT_VALUE: ${{ inputs.production_export_value }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      DATA_TOOLS_IMAGE: ${{ inputs.data_tools_image }}
      FLYWAY_IMAGE: ${{ inputs.flyway_image }}
      FAILURE_INJECTION_POINT: ${{ inputs.failure_injection_point }}

    steps:
      - name: Check out approved release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Download exact projection release coordinate
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/projection-release

      - name: Stage and activate exact ranking generation
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: bash scripts/run-projection-deployment.sh
