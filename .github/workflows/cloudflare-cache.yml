name: Sync Cloudflare Cache Rule

on:
  push:
    branches: [main]
    paths:
      - "ops/cloudflare-cache-rule.json"
      - "scripts/sync-cloudflare-cache-rule.mjs"
      - ".github/workflows/cloudflare-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'coder13/wcarankings-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the public API cache rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/sync-cloudflare-cache-rule.mjs
