name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint checks
        run: pnpm run lint

      - name: Check application types
        run: pnpm run typecheck

      - name: Check data-tool types
        run: pnpm run data-tools:typecheck

      - name: Build application and run projection tests
        run: pnpm test

      - name: Run TypeScript unit tests
        run: pnpm run test:unit

  validate:
    name: Database and Application Validation
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: wcarankings
      MYSQL_USER: wcarankings
      MYSQL_PASSWORD: local-development-password
      MYSQL_ROOT_PASSWORD: local-root-password
      DATABASE_URL: mysql://wcarankings:local-development-password@db:3306/wcarankings

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate independent component identities
        id: components
        run: |
          fingerprints=$(bun scripts/server-component-fingerprints.ts)
          echo "app=$(jq -r '.app' <<<"$fingerprints")" >> "$GITHUB_OUTPUT"
          echo "flyway=$(jq -r '.flyway' <<<"$fingerprints")" >> "$GITHUB_OUTPUT"
          echo "data_tools=$(jq -r '.dataTools' <<<"$fingerprints")" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore unchanged component images
        id: existing
        run: |
          restore() {
            component=$1
            hash=$2
            local_tag=$3
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-${component}:component-${hash}"
            if docker pull "$ref"; then
              docker tag "$ref" "$local_tag"
              echo "${component//-/_}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${component//-/_}=false" >> "$GITHUB_OUTPUT"
            fi
          }
          restore flyway '${{ steps.components.outputs.flyway }}' wcarankings-flyway:pull-request
          restore app '${{ steps.components.outputs.app }}' wcarankings-app:pull-request
          restore data-tools '${{ steps.components.outputs.data_tools }}' wcarankings-data-tools:pull-request

      - name: Build Flyway image
        if: steps.existing.outputs.flyway != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.flyway
          load: true
          push: false
          tags: |
            wcarankings-flyway:pull-request
            ghcr.io/${{ github.repository_owner }}/wcarankings-flyway:component-${{ steps.components.outputs.flyway }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=component-${{ steps.components.outputs.flyway }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Flyway image and migrations
        run: |
          docker run --rm --entrypoint sh wcarankings-flyway:pull-request -c \
            'test -f /flyway/migrations/app/V1__export_metadata.sql && test -f /flyway/migrations/app/V2__import_health.sql && test -f /flyway/migrations/app/V3__projection_build_timing.sql && test -f /flyway/migrations/results/V4__result_projection_health.sql && test -f /flyway/migrations/results/V8__result_attempts_lookup.sql'
          docker tag wcarankings-flyway:pull-request wcarankings-flyway:latest
          docker compose up -d db
          until docker compose exec -T db mariadb-admin ping \
            -h 127.0.0.1 \
            -u"$MYSQL_USER" \
            -p"$MYSQL_PASSWORD" \
            --silent; do
            sleep 2
          done
          docker compose exec -T db mariadb \
            --user="$MYSQL_USER" \
            --password="$MYSQL_PASSWORD" \
            "$MYSQL_DATABASE" \
            --execute="CREATE TABLE IF NOT EXISTS export_metadata (\`key\` VARCHAR(64) NOT NULL PRIMARY KEY, \`value\` TEXT NOT NULL); CREATE TABLE IF NOT EXISTS result_attempts (result_id BIGINT NOT NULL, attempt_number INT NOT NULL, value INT NOT NULL)"
          docker compose run --rm \
            -e FLYWAY_TABLE=flyway_schema_history_app \
            flyway migrate
          docker compose run --rm \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
            -e FLYWAY_TABLE=flyway_schema_history_results \
            flyway migrate
          docker compose run --rm \
            -e FLYWAY_TABLE=flyway_schema_history_app \
            flyway info
          docker compose run --rm \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
            -e FLYWAY_TABLE=flyway_schema_history_results \
            flyway info
          docker compose run --rm \
            -e FLYWAY_TABLE=flyway_schema_history_app \
            flyway validate
          docker compose run --rm \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
            -e FLYWAY_TABLE=flyway_schema_history_results \
            flyway validate

      - name: Exercise application database timeout and rollback
        env:
          DATABASE_URL: mysql://wcarankings:local-development-password@127.0.0.1:13307/wcarankings
          DATABASE_POOL_MAX: 1
          DATABASE_STATEMENT_TIMEOUT_MS: 250
        run: node --import tsx tests/database-timeout.integration.ts

      - name: Build production Docker image
        if: steps.existing.outputs.app != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            wcarankings-app:pull-request
            ghcr.io/${{ github.repository_owner }}/wcarankings-app:component-${{ steps.components.outputs.app }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=component-${{ steps.components.outputs.app }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build data-tools Docker image
        if: steps.existing.outputs.data_tools != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.data-tools
          load: true
          push: false
          tags: |
            wcarankings-data-tools:pull-request
            ghcr.io/${{ github.repository_owner }}/wcarankings-data-tools:component-${{ steps.components.outputs.data_tools }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=component-${{ steps.components.outputs.data_tools }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify data-tools image
        run: |
          docker run --rm --entrypoint sh wcarankings-data-tools:pull-request -c \
            'test -f /app/release-compatibility.json && test -f /app/scripts/projections/generation/activate-ranking-generation.ts && test -f /app/scripts/sync-wca-export.ts'

      - name: Verify production image contents
        run: |
          docker run --rm --entrypoint sh wcarankings-app:pull-request -c \
            'test -f /app/docker-entrypoint.sh && test -f /app/release-compatibility.json && test ! -d /app/sql && test ! -f /app/scripts/sync-wca-export.ts'

      - name: Seed visual smoke-test database
        run: |
          docker tag wcarankings-app:pull-request wcarankings-app:latest
          docker tag wcarankings-data-tools:pull-request wcarankings-data-tools:latest
          docker compose exec -T db mariadb \
            --user="$MYSQL_USER" \
            --password="$MYSQL_PASSWORD" \
            "$MYSQL_DATABASE" < tests/fixtures/visual-smoke.sql
          docker compose run --rm data-tools /app/scripts/projections/build/build-projection-groups.ts
          docker compose run --rm data-tools /app/scripts/refresh-rankings.ts
          docker compose run --rm data-tools /app/scripts/projections/generation/activate-ranking-generation.ts bootstrap
          docker compose run --rm data-tools /app/scripts/projections/generation/activate-ranking-generation.ts bootstrap \
            | grep -q '"bootstrapped":false'

      - name: Exercise candidate-schema activation against disposable MariaDB
        env:
          INTEGRATION_ADMIN_DATABASE_URL: mysql://wcarankings:local-development-password@db:3306/mysql
        run: |
          docker compose exec -T db mariadb \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --execute="GRANT ALL PRIVILEGES ON *.* TO 'wcarankings'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          docker compose run --rm \
            -e INTEGRATION_ADMIN_DATABASE_URL="$INTEGRATION_ADMIN_DATABASE_URL" \
            -v "$GITHUB_WORKSPACE:/app/repo:ro" \
            data-tools test /app/repo/tests/person-lookup-index.integration.test.mjs
          docker compose run --rm \
            -e INTEGRATION_ADMIN_DATABASE_URL="$INTEGRATION_ADMIN_DATABASE_URL" \
            -v "$GITHUB_WORKSPACE:/app/repo:ro" \
            data-tools test /app/repo/tests/ranking-generation-activation.integration.test.mjs

      - name: Start visual smoke-test app
        run: |
          docker compose up -d --no-build app
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for visual smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual smoke test
        run: pnpm exec playwright test --config=playwright.visual-smoke.config.mjs

      - name: Run List Browser Tests
        run: pnpm exec playwright test --config=playwright.list-e2e.config.mjs

      - name: Show Database State After Browser Test Failure
        if: failure()
        run: |
          docker compose exec -T db mariadb \
            --user="$MYSQL_USER" \
            --password="$MYSQL_PASSWORD" \
            "$MYSQL_DATABASE" \
            --batch \
            --skip-column-names \
            --execute="
              SHOW TABLES LIKE 'person_event_rankings';
              SHOW TABLES LIKE 'result_facts';
              SHOW TABLES LIKE 'list%';
              SELECT system_alias, name FROM lists WHERE system_alias IN ('max', 'luke');
              SELECT list_id, COUNT(*) FROM list_members GROUP BY list_id;
            "

      - name: Show Application Logs After Browser Test Failure
        if: failure()
        run: docker compose logs app

      - name: Upload Browser Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/visual-smoke.png
            artifacts/visual-playwright-report
            artifacts/list-playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Publish changed verified component images
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ '${{ steps.existing.outputs.flyway }}' != true ]; then
            docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-flyway:component-${{ steps.components.outputs.flyway }}"
          fi
          if [ '${{ steps.existing.outputs.app }}' != true ]; then
            docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-app:component-${{ steps.components.outputs.app }}"
          fi
          if [ '${{ steps.existing.outputs.data_tools }}' != true ]; then
            docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-data-tools:component-${{ steps.components.outputs.data_tools }}"
          fi

      - name: Clean up visual smoke-test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
