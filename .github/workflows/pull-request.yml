name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: wcarankings
      MYSQL_USER: wcarankings
      MYSQL_PASSWORD: local-development-password
      MYSQL_ROOT_PASSWORD: local-root-password
      DATABASE_URL: mysql://wcarankings:local-development-password@db:3306/wcarankings

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate source tree tag
        id: source-tree
        run: echo "sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Build Flyway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.flyway
          load: true
          push: false
          tags: |
            wcarankings-flyway:pull-request
            ghcr.io/${{ github.repository_owner }}/wcarankings-flyway:tree-${{ steps.source-tree.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=tree-${{ steps.source-tree.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Flyway image and migrations
        run: |
          docker run --rm --entrypoint sh wcarankings-flyway:pull-request -c \
            'test -f /flyway/migrations/app/V1__export_metadata.sql && test -f /flyway/migrations/app/V2__import_health.sql && test -f /flyway/migrations/app/V3__projection_build_timing.sql && test -f /flyway/migrations/results/V4__result_projection_health.sql && test -f /flyway/migrations/results/V8__result_attempts_lookup.sql'
          docker tag wcarankings-flyway:pull-request wcarankings-flyway:latest
          docker compose up -d db
          until docker compose exec -T db mariadb-admin ping \
            -h 127.0.0.1 \
            -u"$MYSQL_USER" \
            -p"$MYSQL_PASSWORD" \
            --silent; do
            sleep 2
          done
          docker compose exec -T db mariadb \
            --user="$MYSQL_USER" \
            --password="$MYSQL_PASSWORD" \
            "$MYSQL_DATABASE" \
            --execute="CREATE TABLE IF NOT EXISTS export_metadata (\`key\` VARCHAR(64) NOT NULL PRIMARY KEY, \`value\` TEXT NOT NULL); CREATE TABLE IF NOT EXISTS result_attempts (result_id BIGINT NOT NULL, attempt_number INT NOT NULL)"
          docker compose run --rm \
            -e FLYWAY_TABLE=flyway_schema_history_app \
            flyway migrate
          docker compose run --rm \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
            -e FLYWAY_TABLE=flyway_schema_history_results \
            flyway migrate
          docker compose run --rm \
            -e FLYWAY_TABLE=flyway_schema_history_app \
            flyway info
          docker compose run --rm \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
            -e FLYWAY_TABLE=flyway_schema_history_results \
            flyway info
          docker compose run --rm \
            -e FLYWAY_TABLE=flyway_schema_history_app \
            flyway validate
          docker compose run --rm \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
            -e FLYWAY_TABLE=flyway_schema_history_results \
            flyway validate

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            wcarankings-app:pull-request
            ghcr.io/${{ github.repository_owner }}/wcarankings-app:tree-${{ steps.source-tree.outputs.sha }}
          build-args: |
            APP_COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=tree-${{ steps.source-tree.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build data-tools Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.data-tools
          load: true
          push: false
          tags: |
            wcarankings-data-tools:pull-request
            ghcr.io/${{ github.repository_owner }}/wcarankings-data-tools:tree-${{ steps.source-tree.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=tree-${{ steps.source-tree.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify data-tools image
        run: |
          docker run --rm --entrypoint sh wcarankings-data-tools:pull-request -c \
            'test -f /app/release-compatibility.json && test -f /app/scripts/activate-ranking-generation.mjs && test -f /app/scripts/sync-wca-export.mjs'

      - name: Verify production image contents
        run: |
          docker run --rm --entrypoint sh wcarankings-app:pull-request -c \
            'test -f /app/docker-entrypoint.sh && test -f /app/release-compatibility.json && test ! -d /app/sql && test ! -f /app/scripts/sync-wca-export.mjs'

      - name: Seed visual smoke-test database
        run: |
          docker tag wcarankings-app:pull-request wcarankings-app:latest
          docker tag wcarankings-data-tools:pull-request wcarankings-data-tools:latest
          docker compose exec -T db mariadb \
            --user="$MYSQL_USER" \
            --password="$MYSQL_PASSWORD" \
            "$MYSQL_DATABASE" < tests/fixtures/visual-smoke.sql
          docker compose run --rm data-tools /app/scripts/backfill-result-entries.mjs
          docker compose run --rm data-tools /app/scripts/refresh-rankings.mjs

      - name: Exercise candidate-schema activation against disposable MariaDB
        env:
          INTEGRATION_ADMIN_DATABASE_URL: mysql://wcarankings:local-development-password@db:3306/mysql
        run: |
          docker compose exec -T db mariadb \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --execute="GRANT ALL PRIVILEGES ON *.* TO 'wcarankings'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          docker compose run --rm \
            -e INTEGRATION_ADMIN_DATABASE_URL="$INTEGRATION_ADMIN_DATABASE_URL" \
            -v "$GITHUB_WORKSPACE:/app/repo:ro" \
            data-tools /app/repo/tests/ranking-generation-activation.integration.mjs

      - name: Start visual smoke-test app
        run: |
          docker compose up -d --no-build app
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for visual smoke test
        run: npx playwright install --with-deps chromium

      - name: Run visual smoke test
        run: npx playwright test --config=playwright.visual-smoke.config.mjs

      - name: Upload visual smoke-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-test-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/visual-smoke.png
            artifacts/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified images
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-flyway:tree-${{ steps.source-tree.outputs.sha }}"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-app:tree-${{ steps.source-tree.outputs.sha }}"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-data-tools:tree-${{ steps.source-tree.outputs.sha }}"

      - name: Clean up visual smoke-test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
