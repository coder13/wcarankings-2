name: Plan Incremental Projection Release

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      groups:
        required: false
        default: ""
        type: string
      refresh_export:
        description: Resolve the latest export even when source semantics are unchanged.
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: Select every group but still reuse valid exact artifacts.
        required: false
        default: false
        type: boolean
      bypass_artifact_cache:
        description: Ignore exact GHCR group artifacts.
        required: false
        default: false
        type: boolean
    outputs:
      required:
        value: ${{ jobs.plan.outputs.required }}
      release_groups:
        value: ${{ jobs.plan.outputs.release_groups }}
      build_groups:
        value: ${{ jobs.plan.outputs.build_groups }}
      hydrate_groups:
        value: ${{ jobs.plan.outputs.hydrate_groups }}
      fingerprints:
        value: ${{ jobs.plan.outputs.fingerprints }}
      available_artifacts:
        value: ${{ jobs.plan.outputs.available_artifacts }}
      export_date:
        value: ${{ jobs.plan.outputs.export_date }}
      export_value:
        value: ${{ jobs.plan.outputs.export_value }}
      production_export_value:
        value: ${{ jobs.plan.outputs.production_export_value }}
      raw_required:
        value: ${{ jobs.plan.outputs.raw_required }}
    secrets:
      SERVER_IP:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.final.outputs.required }}
      release_groups: ${{ steps.final.outputs.release_groups }}
      build_groups: ${{ steps.final.outputs.build_groups }}
      hydrate_groups: ${{ steps.final.outputs.hydrate_groups }}
      fingerprints: ${{ steps.final.outputs.fingerprints }}
      available_artifacts: ${{ steps.registry.outputs.available }}
      export_date: ${{ steps.wca.outputs.date }}
      export_value: ${{ steps.wca.outputs.value }}
      production_export_value: ${{ steps.production.outputs.export_value }}
      raw_required: ${{ steps.final.outputs.raw_required }}
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: www

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure read-only production access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read active production projection state
        id: production
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cd /srv/wcarankings && docker compose run --rm -T data-tools \
              /app/scripts/projections/generation/activate-ranking-generation.ts state' \
            > /tmp/production-projection-state.json
          if ! jq -e 'type == "object"' /tmp/production-projection-state.json >/dev/null; then
            printf '{}\n' > /tmp/production-projection-state.json
          fi
          export_value=$(jq -r '.exportId // empty' /tmp/production-projection-state.json)
          test -n "$export_value"
          echo "export_value=$export_value" >> "$GITHUB_OUTPUT"

      - name: Detect semantic projection changes before contacting WCA
        id: semantic
        env:
          SELECTED_GROUPS: ${{ inputs.groups }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          args=(semantic --state-file=/tmp/production-projection-state.json \
            "--force-rebuild=$FORCE_REBUILD")
          if [ -n "$SELECTED_GROUPS" ]; then args+=("--groups=$SELECTED_GROUPS"); fi
          bun scripts/projections/planning/projection-release-plan.ts "${args[@]}" > /tmp/semantic-plan.json
          echo "required=$(jq -r '.required' /tmp/semantic-plan.json)" >> "$GITHUB_OUTPUT"
          echo "groups=$(jq -r '.changedGroupsCsv' /tmp/semantic-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Finish cosmetic push without WCA resolution
        if: steps.semantic.outputs.required != 'true' && inputs.refresh_export != true && inputs.force_rebuild != true
        run: echo "No semantic projection inputs changed; the WCA export was not resolved." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve latest WCA export
        id: wca
        if: steps.semantic.outputs.required == 'true' || inputs.refresh_export == true || inputs.force_rebuild == true
        run: |
          bun scripts/resolve-wca-export.ts > /tmp/wca-export.json
          export_date=$(jq -r '.date' /tmp/wca-export.json)
          export_value=$(jq -r '.exportDate' /tmp/wca-export.json)
          [[ "$export_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$export_value" =~ ^[0-9TZUTC:+.\ -]+$ ]]
          echo "date=$export_date" >> "$GITHUB_OUTPUT"
          echo "value=$export_value" >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@v1
        if: steps.wca.outputs.value != '' && inputs.bypass_artifact_cache != true

      - name: Log in to GHCR for immutable group artifacts
        if: steps.wca.outputs.value != '' && inputs.bypass_artifact_cache != true
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Calculate desired artifact fingerprints
        if: steps.wca.outputs.value != ''
        env:
          EXPORT_VALUE: ${{ steps.wca.outputs.value }}
          PRODUCTION_EXPORT_VALUE: ${{ steps.production.outputs.export_value }}
          SEMANTIC_GROUPS: ${{ steps.semantic.outputs.groups }}
          REQUESTED_GROUPS: ${{ inputs.groups }}
          REFRESH_EXPORT: ${{ inputs.refresh_export }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          selected_groups="$SEMANTIC_GROUPS"
          if [ "$REFRESH_EXPORT" = true ]; then selected_groups="$REQUESTED_GROUPS"; fi
          args=("--export-id=$EXPORT_VALUE" "--production-export-id=$PRODUCTION_EXPORT_VALUE" \
            --state-file=/tmp/production-projection-state.json "--force-rebuild=$FORCE_REBUILD")
          if [ -n "$selected_groups" ]; then args+=("--groups=$selected_groups"); fi
          bun scripts/projections/planning/projection-release-plan.ts "${args[@]}" > /tmp/desired-plan.json

      - name: Resolve exact GHCR group descriptors
        id: registry
        if: steps.wca.outputs.value != ''
        env:
          BYPASS_CACHE: ${{ inputs.bypass_artifact_cache }}
          EXPORT_VALUE: ${{ steps.wca.outputs.value }}
        run: |
          set -euo pipefail
          printf '{}\n' > /tmp/available-artifacts.json
          if [ "$BYPASS_CACHE" != true ]; then
            owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
            while IFS= read -r group; do
              fingerprint=$(jq -r --arg group "$group" '.groups[$group].artifactFingerprint' /tmp/desired-plan.json)
              repository="ghcr.io/${owner}/wcarankings-projection-${group}"
              candidates="$fingerprint"
              repair_tags=$(oras repo tags "$repository" 2>/dev/null \
                | grep -E "^${fingerprint}-repair-[0-9]+-[0-9]+$" \
                | sort -t- -k3,3nr -k4,4nr || true)
              if [ -n "$repair_tags" ]; then candidates=$(printf '%s\n%s\n' "$repair_tags" "$candidates"); fi
              for tag in $candidates; do
                ref="${repository}:${tag}"
                manifest=$(oras manifest fetch "$ref" 2>/dev/null) || continue
                if jq -e \
                  --arg group "$group" \
                  --arg export "$EXPORT_VALUE" \
                  --arg fingerprint "$fingerprint" \
                  '.annotations["io.wcarankings.group"] == $group
                   and .annotations["io.wcarankings.export-id"] == $export
                   and .annotations["io.wcarankings.artifact-fingerprint"] == $fingerprint
                   and .annotations["io.wcarankings.format-version"] == "4"
                   and ([.layers[].mediaType] | index("application/vnd.cuberanks.projection.tables.v1+gzip") != null)
                   and ([.layers[].mediaType] | index("application/vnd.cuberanks.projection.transfer.v4+json") != null)' \
                  <<<"$manifest" >/dev/null; then
                  digest=$(oras manifest fetch --descriptor "$ref" | jq -r '.digest')
                  jq --arg group "$group" --arg fingerprint "$fingerprint" \
                    --arg ref "$ref" --arg digest "$digest" \
                    '.[$group] = {valid:true, artifactFingerprint:$fingerprint, ref:$ref, digest:$digest}' \
                    /tmp/available-artifacts.json > /tmp/available-artifacts.next
                  mv /tmp/available-artifacts.next /tmp/available-artifacts.json
                  break
                else
                  echo "::warning::Ignoring projection artifact with invalid OCI metadata: $ref"
                  jq --arg group "$group" --arg fingerprint "$fingerprint" --arg ref "$ref" \
                    '.[$group] = {valid:false, artifactFingerprint:$fingerprint, ref:$ref}' \
                    /tmp/available-artifacts.json > /tmp/available-artifacts.next
                  mv /tmp/available-artifacts.next /tmp/available-artifacts.json
                fi
              done
            done < <(jq -r '.groups | keys[]' /tmp/desired-plan.json)
          fi
          echo "available=$(jq -c . /tmp/available-artifacts.json)" >> "$GITHUB_OUTPUT"

      - name: Finalize active, cached, build, and hydrate groups
        id: final
        if: steps.wca.outputs.value != ''
        env:
          EXPORT_VALUE: ${{ steps.wca.outputs.value }}
          PRODUCTION_EXPORT_VALUE: ${{ steps.production.outputs.export_value }}
          SEMANTIC_GROUPS: ${{ steps.semantic.outputs.groups }}
          REQUESTED_GROUPS: ${{ inputs.groups }}
          REFRESH_EXPORT: ${{ inputs.refresh_export }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          selected_groups="$SEMANTIC_GROUPS"
          if [ "$REFRESH_EXPORT" = true ]; then selected_groups="$REQUESTED_GROUPS"; fi
          args=("--export-id=$EXPORT_VALUE" "--production-export-id=$PRODUCTION_EXPORT_VALUE" \
            --state-file=/tmp/production-projection-state.json \
            --available-artifacts-file=/tmp/available-artifacts.json \
            "--force-rebuild=$FORCE_REBUILD")
          if [ -n "$selected_groups" ]; then args+=("--groups=$selected_groups"); fi
          bun scripts/projections/planning/projection-release-plan.ts "${args[@]}" > /tmp/final-plan.json
          echo "required=$(jq -r '.required' /tmp/final-plan.json)" >> "$GITHUB_OUTPUT"
          echo "release_groups=$(jq -r '.releaseGroups | join(",")' /tmp/final-plan.json)" >> "$GITHUB_OUTPUT"
          echo "build_groups=$(jq -r '.buildGroupsCsv' /tmp/final-plan.json)" >> "$GITHUB_OUTPUT"
          echo "hydrate_groups=$(jq -r '.hydrateGroupsCsv' /tmp/final-plan.json)" >> "$GITHUB_OUTPUT"
          echo "fingerprints=$(jq -c '.groups' /tmp/final-plan.json)" >> "$GITHUB_OUTPUT"
          echo "raw_required=$(jq -r '.exportChanged' /tmp/final-plan.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Incremental projection plan"
            echo "- Active: $(jq -r '.activeGroups | join(", ") // "none"' /tmp/final-plan.json)"
            echo "- Cached: $(jq -r '.cachedGroups | join(", ") // "none"' /tmp/final-plan.json)"
            echo "- Hydrate: $(jq -r '.hydrateGroups | join(", ") // "none"' /tmp/final-plan.json)"
            echo "- Build: $(jq -r '.buildGroups | join(", ") // "none"' /tmp/final-plan.json)"
          } >> "$GITHUB_STEP_SUMMARY"
