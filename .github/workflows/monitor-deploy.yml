name: Monitor merged deployment

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Report merged deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 18ed20ccb38a72261b72cf46400fca834872ed77
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20"
          response=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          run=$(jq -c '.workflow_runs | map(select(.name == "Deploy CubeRanks")) | sort_by(.created_at) | last // empty' <<<"$response")
          if [ -z "$run" ]; then
            echo "Deploy run has not appeared yet." >&2
            exit 1
          fi
          echo "DEPLOY_RUN_ID=$(jq -r '.id' <<<"$run")"
          echo "DEPLOY_STATUS=$(jq -r '.status' <<<"$run")"
          echo "DEPLOY_CONCLUSION=$(jq -r '.conclusion // ""' <<<"$run")"
          echo "DEPLOY_URL=$(jq -r '.html_url' <<<"$run")"
