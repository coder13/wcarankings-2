name: Monitor merged deployment

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify deployed production image and endpoints
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: www
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" 'set -eu
            cd /srv/wcarankings
            latest_image=$(docker image inspect wcarankings-app:latest --format "{{.Id}}")
            running_image=$(docker inspect wcarankings-app-1 --format "{{.Image}}")
            test "$latest_image" = "$running_image"
            docker compose ps
            curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready
            curl --fail --silent --show-error --max-time 15 "http://127.0.0.1:3000/api/rankings?eventId=333&result=single&year=2024&start=0&limit=1&paged=1" >/dev/null
            curl --fail --silent --show-error --max-time 15 "http://127.0.0.1:3000/api/rankings/competitions?ranking=competitor-count&start=0&limit=10" >/dev/null
            echo "RUNNING_IMAGE=$running_image"'
          curl --fail --silent --show-error --max-time 20 "$SERVER_HOST" >/dev/null
          echo "PUBLIC_SITE_OK=true"
