name: Monitor merged deployment

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect production projection import
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: www
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" 'set -eu
            cd /srv/wcarankings
            echo "=== containers ==="
            docker compose ps
            echo "=== MariaDB process list ==="
            docker compose exec -T db sh -c '\''mariadb --batch --user="$MARIADB_USER" --password="$MARIADB_PASSWORD" "$MARIADB_DATABASE" --execute="SHOW FULL PROCESSLIST"'\''
            echo "=== transfer files ==="
            ls -lh /tmp/wcarankings-*-projection-transfer.sql.gz 2>/dev/null || true
            echo "=== container resource use ==="
            docker stats --no-stream --format "{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.BlockIO}}"
            echo "=== disk ==="
            df -h /srv/wcarankings'
