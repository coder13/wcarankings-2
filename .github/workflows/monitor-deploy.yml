name: Monitor merged deployment

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for merged deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 18ed20ccb38a72261b72cf46400fca834872ed77
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20"
          for attempt in $(seq 1 120); do
            response=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")
            run=$(jq -c '.workflow_runs | map(select(.name == "Deploy CubeRanks")) | sort_by(.created_at) | last // empty' <<<"$response")
            if [ -z "$run" ]; then
              echo "Deploy run has not appeared yet (attempt ${attempt}/120)."
              sleep 10
              continue
            fi

            run_id=$(jq -r '.id' <<<"$run")
            status=$(jq -r '.status' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            run_url=$(jq -r '.html_url' <<<"$run")
            echo "DEPLOY_RUN_ID=${run_id}"
            echo "DEPLOY_STATUS=${status}"
            echo "DEPLOY_CONCLUSION=${conclusion}"
            echo "DEPLOY_URL=${run_url}"

            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                exit 0
              fi
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for the deployment run." >&2
          exit 1
