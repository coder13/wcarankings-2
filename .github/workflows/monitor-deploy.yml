name: Monitor merged deployment

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public production HTTPS
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          resolve="--resolve wcarankings.com:443:${SERVER_IP}"
          curl $resolve --fail --silent --show-error --max-time 20 https://wcarankings.com/ >/dev/null
          curl $resolve --fail --silent --show-error --max-time 20 https://wcarankings.com/api/health/ready | grep -q '"status":"ready"'
          curl $resolve --fail --silent --show-error --max-time 20 'https://wcarankings.com/api/rankings?eventId=333&result=single&year=2024&start=0&limit=1&paged=1' >/dev/null
          curl $resolve --fail --silent --show-error --max-time 20 'https://wcarankings.com/api/rankings/competitions?ranking=competitor-count&start=0&limit=10' >/dev/null
          echo "PUBLIC_HTTPS_OK=true"
