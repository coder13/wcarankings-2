name: Deploy CubeRanks

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan projections and build server images without changing production.
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: Rebuild all projection groups and refresh server images when the release images are unavailable.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production-mutation
  cancel-in-progress: false
  queue: max

jobs:
  plan_projections:
    uses: ./.github/workflows/plan-projections.yml
    with:
      ref: ${{ github.sha }}
      force_rebuild: ${{ inputs.force_rebuild == true }}
    secrets: inherit

  build_server:
    uses: ./.github/workflows/build-server.yml
    with:
      ref: ${{ github.sha }}
      force_rebuild: false
      require_existing: false
    secrets: inherit

  build_projections:
    needs: plan_projections
    uses: ./.github/workflows/build-projections.yml
    with:
      ref: ${{ github.sha }}
      export_date: ${{ needs.plan_projections.outputs.export_date }}
      export_value: ${{ needs.plan_projections.outputs.export_value }}
      groups: ${{ needs.plan_projections.outputs.groups }}
      fingerprints: ${{ needs.plan_projections.outputs.fingerprints }}
      cache_only: ${{ inputs.dry_run == true }}
      include_raw: ${{ needs.plan_projections.outputs.raw_required == 'true' }}
    secrets: inherit

  deploy_server:
    if: >-
      inputs.dry_run != true
      && needs.build_server.result == 'success'
      && needs.build_projections.result == 'success'
    needs:
      - plan_projections
      - build_server
      - build_projections
    uses: ./.github/workflows/deploy-server.yml
    with:
      ref: ${{ github.sha }}
      source_sha: ${{ needs.build_server.outputs.source_sha }}
      app_image: ${{ needs.build_server.outputs.app_image }}
      flyway_image: ${{ needs.build_server.outputs.flyway_image }}
      data_tools_image: ${{ needs.build_server.outputs.data_tools_image }}
      config_checksum: ${{ needs.build_server.outputs.config_checksum }}
      compose_checksum: ${{ needs.build_server.outputs.compose_checksum }}
      caddy_checksum: ${{ needs.build_server.outputs.caddy_checksum }}
    secrets: inherit

  deploy_projections:
    if: >-
      inputs.dry_run != true
      && needs.plan_projections.outputs.required == 'true'
      && needs.deploy_server.result == 'success'
      && needs.build_projections.result == 'success'
    needs:
      - plan_projections
      - build_projections
      - build_server
      - deploy_server
    uses: ./.github/workflows/deploy-projections.yml
    with:
      ref: ${{ github.sha }}
      artifact_name: ${{ needs.build_projections.outputs.artifact_name }}
      manifest_sha256: ${{ needs.build_projections.outputs.manifest_sha256 }}
      groups: ${{ needs.plan_projections.outputs.groups }}
      export_date: ${{ needs.plan_projections.outputs.export_date }}
      export_value: ${{ needs.plan_projections.outputs.export_value }}
      production_export_value: ${{ needs.plan_projections.outputs.production_export_value }}
      source_sha: ${{ needs.build_server.outputs.source_sha }}
      artifact_run_id: ${{ needs.build_projections.outputs.artifact_run_id }}
      artifact_id: ${{ needs.build_projections.outputs.artifact_id }}
      data_tools_image: ${{ needs.build_server.outputs.data_tools_image }}
    secrets: inherit
