name: Deploy Server Images

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref containing the deployment configuration.
        required: true
        type: string
      source_sha:
        description: Commit SHA represented by the images.
        required: true
        type: string
      app_image:
        description: Digest-qualified application image.
        required: true
        type: string
      flyway_image:
        description: Digest-qualified Flyway image.
        required: true
        type: string
      data_tools_image:
        description: Digest-qualified approved data-tools image.
        required: true
        type: string
      config_checksum:
        description: Combined Compose and Caddy checksum.
        required: true
        type: string
      compose_checksum:
        description: Compose configuration checksum.
        required: true
        type: string
      caddy_checksum:
        description: Caddy configuration checksum.
        required: true
        type: string
      failure_injection_point:
        description: Test-only failure boundary.
        required: false
        default: ""
        type: string
    secrets:
      SERVER_IP:
        required: true
      SERVER_HOST:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.repository == 'coder13/wcarankings-2'
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: www
      SOURCE_SHA: ${{ inputs.source_sha }}
      APP_IMAGE: ${{ inputs.app_image }}
      FLYWAY_IMAGE: ${{ inputs.flyway_image }}
      DATA_TOOLS_IMAGE: ${{ inputs.data_tools_image }}
      CONFIG_CHECKSUM: ${{ inputs.config_checksum }}
      COMPOSE_CHECKSUM: ${{ inputs.compose_checksum }}
      CADDY_CHECKSUM: ${{ inputs.caddy_checksum }}
      FAILURE_INJECTION_POINT: ${{ inputs.failure_injection_point }}

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate immutable release inputs
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_IMAGE" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
          [[ "$FLYWAY_IMAGE" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
          [[ "$DATA_TOOLS_IMAGE" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
          [[ "$CONFIG_CHECKSUM" =~ ^[0-9a-f]{64}$ ]]
          [[ "$COMPOSE_CHECKSUM" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CADDY_CHECKSUM" =~ ^[0-9a-f]{64}$ ]]

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Pull immutable images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify and tag immutable images
        run: |
          docker pull "$APP_IMAGE"
          docker pull "$FLYWAY_IMAGE"
          docker pull "$DATA_TOOLS_IMAGE"
          docker tag "$APP_IMAGE" "wcarankings-app:${SOURCE_SHA}"
          docker tag "$FLYWAY_IMAGE" "wcarankings-flyway:${SOURCE_SHA}"
          docker tag "$DATA_TOOLS_IMAGE" "wcarankings-data-tools:${SOURCE_SHA}"
          test "$(docker image inspect "$APP_IMAGE" --format '{{index .RepoDigests 0}}')" = "$APP_IMAGE"
          test "$(docker image inspect "$FLYWAY_IMAGE" --format '{{index .RepoDigests 0}}')" = "$FLYWAY_IMAGE"
          test "$(docker image inspect "$DATA_TOOLS_IMAGE" --format '{{index .RepoDigests 0}}')" = "$DATA_TOOLS_IMAGE"

      - name: Check server compatibility with the active dataset
        run: |
          docker run --rm --entrypoint cat "$APP_IMAGE" /app/release-compatibility.json \
            > /tmp/server-release-compatibility.json
          dataset_schema_version=$(ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cd /srv/wcarankings && docker compose exec -T db sh -c '"'"'
              mariadb --batch --skip-column-names \
                --user="$MARIADB_USER" --password="$MARIADB_PASSWORD" "$MARIADB_DATABASE" \
                --execute="SELECT dataset_schema_version FROM ranking_generation_state WHERE id = 1" \
                2>/dev/null || printf "1\n"
            '"'"'')
          if [[ ! "$dataset_schema_version" =~ ^[1-9][0-9]*$ ]]; then
            echo "No active dataset schema version was found; using the pre-cutover baseline (1)."
            dataset_schema_version=1
          fi
          node scripts/check-release-compatibility.mjs \
            --compatibility-file=/tmp/server-release-compatibility.json \
            --dataset-schema-version="$dataset_schema_version"

      - name: Copy deployment configuration
        run: |
          set -o pipefail
          scp -q -o BatchMode=yes docker-compose.yml \
            "$SERVER_USER@$SERVER_IP:/tmp/wcarankings-compose-${SOURCE_SHA}.yml"
          scp -q -o BatchMode=yes ops/Caddyfile \
            "$SERVER_USER@$SERVER_IP:/tmp/wcarankings-Caddyfile-${SOURCE_SHA}"
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'set -eu
            install -d -m 0755 /srv/wcarankings/ops'
          current_state=$(ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cat /srv/wcarankings/server-release-state.json 2>/dev/null || printf "{}\n"')
          current_compose=$(jq -r '.composeChecksum // ""' <<<"$current_state")
          current_caddy=$(jq -r '.caddyChecksum // ""' <<<"$current_state")
          current_caddy_file=$(jq -r '.caddyFileChecksum // ""' <<<"$current_state")
          current_app=$(jq -r '.appImage // ""' <<<"$current_state")
          current_flyway=$(jq -r '.flywayImage // ""' <<<"$current_state")
          current_data_tools=$(jq -r '.dataToolsImage // ""' <<<"$current_state")
          current_source_sha=$(jq -r '.sourceSha // "unknown"' <<<"$current_state")
          candidate_caddy_file=$(sha256sum ops/Caddyfile | cut -d' ' -f1)
          resolve_approved_caddy_file_checksum() {
            raw_checksum=$1
            composite_checksum=$2
            source_sha=$3
            if [ -n "$raw_checksum" ]; then
              if [[ ! "$raw_checksum" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Approved state contains an invalid raw Caddyfile checksum." >&2
                return 1
              fi
              printf '%s\n' "$raw_checksum"
              return 0
            fi
            if [ -z "$composite_checksum" ]; then
              return 0
            fi
            if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Approved state lacks a source commit for Caddy file recovery." >&2
              return 1
            fi
            if ! git cat-file -e "${source_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$source_sha" >&2
            fi
            git show "${source_sha}:ops/Caddyfile" | sha256sum | cut -d' ' -f1
          }
          current_caddy_file=$(resolve_approved_caddy_file_checksum \
            "$current_caddy_file" "$current_caddy" "$current_source_sha")
          if [ -z "$(jq -r '.caddyFileChecksum // ""' <<<"$current_state")" ] \
            && [ -n "$current_caddy" ]; then
            echo "Derived the approved raw Caddyfile checksum from ${current_source_sha}."
          fi
          [[ "$candidate_caddy_file" =~ ^[0-9a-f]{64}$ ]]
          [ "$current_app" = "$APP_IMAGE" ] && app_changed=false || app_changed=true
          [ "$current_flyway" = "$FLYWAY_IMAGE" ] && flyway_changed=false || flyway_changed=true
          [ "$current_data_tools" = "$DATA_TOOLS_IMAGE" ] && data_tools_changed=false || data_tools_changed=true
          [ "$current_compose" = "$COMPOSE_CHECKSUM" ] && compose_changed=false || compose_changed=true
          echo "APP_IMAGE_CHANGED=$app_changed" >> "$GITHUB_ENV"
          echo "FLYWAY_IMAGE_CHANGED=$flyway_changed" >> "$GITHUB_ENV"
          echo "DATA_TOOLS_IMAGE_CHANGED=$data_tools_changed" >> "$GITHUB_ENV"
          echo "COMPOSE_CONFIG_CHANGED=$compose_changed" >> "$GITHUB_ENV"
          echo "PREVIOUS_SOURCE_SHA=$current_source_sha" >> "$GITHUB_ENV"
          echo "PREVIOUS_COMPOSE_CHECKSUM=$current_compose" >> "$GITHUB_ENV"
          echo "PREVIOUS_CADDY_CHECKSUM=$current_caddy" >> "$GITHUB_ENV"
          echo "CADDY_FILE_CHECKSUM=$candidate_caddy_file" >> "$GITHUB_ENV"
          echo "PREVIOUS_CADDY_FILE_CHECKSUM=$current_caddy_file" >> "$GITHUB_ENV"
          if [ "$app_changed" = true ] || [ "$compose_changed" = true ]; then
            echo "APP_SERVICE_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "APP_SERVICE_CHANGED=false" >> "$GITHUB_ENV"
          fi
          if [ "$current_caddy" != "$CADDY_CHECKSUM" ]; then
            echo "PROXY_CONFIG_CHANGED=true" >> "$GITHUB_ENV"
            proxy_changed=true
          else
            echo "PROXY_CONFIG_CHANGED=false" >> "$GITHUB_ENV"
            proxy_changed=false
          fi
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "SOURCE_SHA='$SOURCE_SHA' COMPOSE_CONFIG_CHANGED='$compose_changed' \
             PROXY_CONFIG_CHANGED='$proxy_changed' \
             PREVIOUS_COMPOSE_CHECKSUM='$current_compose' \
             PREVIOUS_CADDY_FILE_CHECKSUM='$current_caddy_file' sh -s" <<'REMOTE'
            set -eu
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8
            config_marker="/srv/wcarankings/server-release-${SOURCE_SHA}.config-staging"
            recover_approved_config() {
              target=$1
              backup=$2
              expected=$3
              label=$4
              if [ -z "$expected" ] || [ ! -f "$target" ]; then return 0; fi
              current=$(sha256sum "$target" | awk '{print $1}')
              if [ "$current" = "$expected" ]; then return 0; fi
              if [ ! -f "$backup" ]; then
                echo "$label differs from approved state and has no recovery copy." >&2
                return 1
              fi
              previous=$(sha256sum "$backup" | awk '{print $1}')
              if [ "$previous" != "$expected" ]; then
                echo "$label recovery copy does not match approved state." >&2
                return 1
              fi
              cp "$backup" "$target"
              echo "Recovered approved $label after an interrupted pre-switch release."
            }
            recover_approved_config \
              /srv/wcarankings/docker-compose.yml \
              /srv/wcarankings/docker-compose.yml.previous \
              "$PREVIOUS_COMPOSE_CHECKSUM" "Compose configuration"
            recover_approved_config \
              /srv/wcarankings/ops/Caddyfile \
              /srv/wcarankings/ops/Caddyfile.previous \
              "$PREVIOUS_CADDY_FILE_CHECKSUM" "Caddy configuration"
            if [ -f /srv/wcarankings/server-release-state.json ]; then
              cp /srv/wcarankings/server-release-state.json \
                /srv/wcarankings/server-release-state.json.previous
            fi
            if [ -f /srv/wcarankings/docker-compose.yml ]; then
              cp /srv/wcarankings/docker-compose.yml \
                /srv/wcarankings/docker-compose.yml.previous
            else
              rm -f /srv/wcarankings/docker-compose.yml.previous
            fi
            if [ -f /srv/wcarankings/ops/Caddyfile ]; then
              cp /srv/wcarankings/ops/Caddyfile \
                /srv/wcarankings/ops/Caddyfile.previous
            else
              rm -f /srv/wcarankings/ops/Caddyfile.previous
            fi
            write_config_marker() {
              marker_tmp="${config_marker}.tmp.$$"
              printf '%s\n' "$1" > "$marker_tmp"
              mv "$marker_tmp" "$config_marker"
            }
            if [ "$COMPOSE_CONFIG_CHANGED" = true ] || [ "$PROXY_CONFIG_CHANGED" = true ]; then
              # Record mutation intent before the first move so cancellation can
              # never leave an unmarked partial configuration stage.
              write_config_marker prepared
            else
              rm -f "$config_marker"
            fi
            if [ "$COMPOSE_CONFIG_CHANGED" = true ]; then
              mv "/tmp/wcarankings-compose-${SOURCE_SHA}.yml" \
                /srv/wcarankings/docker-compose.yml
            else
              rm -f "/tmp/wcarankings-compose-${SOURCE_SHA}.yml"
            fi
            if [ "$PROXY_CONFIG_CHANGED" = true ]; then
              mv "/tmp/wcarankings-Caddyfile-${SOURCE_SHA}" \
                /srv/wcarankings/ops/Caddyfile
            else
              rm -f "/tmp/wcarankings-Caddyfile-${SOURCE_SHA}"
            fi
            if [ -f "$config_marker" ]; then
              write_config_marker staged
            fi
          REMOTE

      - name: Stage server images and run migrations
        run: |
          set -o pipefail
          candidate_app_image_id=$(docker image inspect --format '{{.Id}}' "wcarankings-app:${SOURCE_SHA}")
          candidate_flyway_image_id=$(docker image inspect --format '{{.Id}}' "wcarankings-flyway:${SOURCE_SHA}")
          candidate_data_tools_image_id=$(docker image inspect --format '{{.Id}}' "wcarankings-data-tools:${SOURCE_SHA}")
          image_transfer_required() {
            changed=$1
            remote_image_id=$2
            candidate_image_id=$3
            [ "$changed" = true ] || [ -z "$remote_image_id" ] || [ "$remote_image_id" != "$candidate_image_id" ]
          }
          remote_image_id() {
            ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
              "docker image inspect --format '{{.Id}}' '$1' 2>/dev/null || true"
          }
          remote_app_image_id=$(remote_image_id wcarankings-app:latest)
          remote_flyway_image_id=$(remote_image_id wcarankings-flyway:latest)
          remote_data_tools_image_id=$(remote_image_id wcarankings-data-tools:latest)
          APP_IMAGE_TRANSFER_REQUIRED=false
          FLYWAY_IMAGE_TRANSFER_REQUIRED=false
          DATA_TOOLS_IMAGE_TRANSFER_REQUIRED=false
          if image_transfer_required "$APP_IMAGE_CHANGED" "$remote_app_image_id" "$candidate_app_image_id"; then
            APP_IMAGE_TRANSFER_REQUIRED=true
          fi
          if image_transfer_required "$FLYWAY_IMAGE_CHANGED" "$remote_flyway_image_id" "$candidate_flyway_image_id"; then
            FLYWAY_IMAGE_TRANSFER_REQUIRED=true
          fi
          if image_transfer_required "$DATA_TOOLS_IMAGE_CHANGED" "$remote_data_tools_image_id" "$candidate_data_tools_image_id"; then
            DATA_TOOLS_IMAGE_TRANSFER_REQUIRED=true
          fi
          echo "Image transfer requirements: app=${APP_IMAGE_TRANSFER_REQUIRED}, flyway=${FLYWAY_IMAGE_TRANSFER_REQUIRED}, data-tools=${DATA_TOOLS_IMAGE_TRANSFER_REQUIRED}."
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "APP_IMAGE_CHANGED='$APP_IMAGE_CHANGED' \
             CANDIDATE_APP_IMAGE_ID='$candidate_app_image_id' sh -s" <<'REMOTE'
            set -eu
            cd /srv/wcarankings
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8
            if [ "$APP_IMAGE_CHANGED" = true ]; then
              app_container=$(docker compose ps -q app)
              if [ -z "$app_container" ]; then
                echo "Cannot preserve the active app image because the production app container is not running." >&2
                exit 1
              fi
              running_app_image=$(docker inspect --format '{{.Image}}' "$app_container")
              echo "Running app image is ${running_app_image}; candidate image is ${CANDIDATE_APP_IMAGE_ID}."
              if [ "$running_app_image" = "$CANDIDATE_APP_IMAGE_ID" ]; then
                previous_app_image=$(docker image inspect --format '{{.Id}}' \
                  wcarankings-app:previous 2>/dev/null || true)
                if [ -z "$previous_app_image" ] || [ "$previous_app_image" = "$CANDIDATE_APP_IMAGE_ID" ]; then
                  echo "The running app is already the candidate and no distinct rollback image is available." >&2
                  exit 1
                fi
                echo "The running app already uses the candidate; preserving distinct rollback image ${previous_app_image}."
              else
                docker tag "$running_app_image" wcarankings-app:previous
              fi
            fi
          REMOTE
          changed_images=()
          if [ "$APP_IMAGE_TRANSFER_REQUIRED" = true ]; then changed_images+=("wcarankings-app:${SOURCE_SHA}"); fi
          if [ "$FLYWAY_IMAGE_TRANSFER_REQUIRED" = true ]; then changed_images+=("wcarankings-flyway:${SOURCE_SHA}"); fi
          if [ "$DATA_TOOLS_IMAGE_TRANSFER_REQUIRED" = true ]; then changed_images+=("wcarankings-data-tools:${SOURCE_SHA}"); fi
          if [ "${#changed_images[@]}" -gt 0 ]; then
            docker save "${changed_images[@]}" | gzip -1 \
              | ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" 'gzip -d | docker load'
          fi
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "APP_IMAGE_CHANGED='$APP_IMAGE_CHANGED' \
             FLYWAY_IMAGE_CHANGED='$FLYWAY_IMAGE_CHANGED' \
             DATA_TOOLS_IMAGE_CHANGED='$DATA_TOOLS_IMAGE_CHANGED' \
             APP_IMAGE_TRANSFER_REQUIRED='$APP_IMAGE_TRANSFER_REQUIRED' \
             FLYWAY_IMAGE_TRANSFER_REQUIRED='$FLYWAY_IMAGE_TRANSFER_REQUIRED' \
             DATA_TOOLS_IMAGE_TRANSFER_REQUIRED='$DATA_TOOLS_IMAGE_TRANSFER_REQUIRED' \
             SOURCE_SHA='$SOURCE_SHA' sh -s" <<'REMOTE'
            set -eu
            read_database_cpu() {
              db_container=$(docker compose ps -q db)
              if ! cpu=$(timeout 5 docker stats --no-stream --format '{{.CPUPerc}}' "$db_container"); then
                echo "Timed out reading MariaDB CPU usage." >&2
                return 1
              fi
              cpu=$(printf '%s' "$cpu" | tr -d '%')
              if ! printf '%s\n' "$cpu" | grep -Eq '^[0-9]+([.][0-9]+)?$'; then
                echo "Could not read MariaDB CPU usage: ${cpu:-unknown}." >&2
                return 1
              fi
              printf '%s\n' "$cpu"
            }
            measure_database_cpu_baseline() {
              baseline_samples=0
              attempt=1
              while [ "$attempt" -le 12 ]; do
                cpu=$(read_database_cpu)
                echo "MariaDB pre-migration baseline attempt ${attempt}/12: ${cpu}% CPU."
                if [ "$baseline_samples" -eq 0 ]; then
                  baseline_first=$cpu
                  baseline_samples=1
                elif [ "$baseline_samples" -eq 1 ]; then
                  baseline_second=$cpu
                  baseline_samples=2
                elif [ "$baseline_samples" -eq 2 ]; then
                  baseline_third=$cpu
                  baseline_samples=3
                else
                  baseline_first=$baseline_second
                  baseline_second=$baseline_third
                  baseline_third=$cpu
                fi
                if [ "$baseline_samples" -eq 3 ]; then
                  candidate_baseline=$(awk "BEGIN { printf \"%.2f\", ($baseline_first + $baseline_second + $baseline_third) / 3 }")
                  candidate_delta=$(awk "BEGIN { delta = $candidate_baseline * 0.15; if (delta < 10) delta = 10; if (delta > 25) delta = 25; printf \"%.2f\", delta }")
                  candidate_min=$(awk "BEGIN { min = $baseline_first; if ($baseline_second < min) min = $baseline_second; if ($baseline_third < min) min = $baseline_third; printf \"%.2f\", min }")
                  candidate_max=$(awk "BEGIN { max = $baseline_first; if ($baseline_second > max) max = $baseline_second; if ($baseline_third > max) max = $baseline_third; printf \"%.2f\", max }")
                  candidate_spread=$(awk "BEGIN { printf \"%.2f\", $candidate_max - $candidate_min }")
                  echo "MariaDB pre-migration baseline window: ${baseline_first}%, ${baseline_second}%, ${baseline_third}% (spread ${candidate_spread}, band ${candidate_delta})."
                  if awk "BEGIN { exit !($candidate_spread <= $candidate_delta) }"; then
                    DATABASE_CPU_BASELINE=$candidate_baseline
                    DATABASE_CPU_DELTA=$candidate_delta
                    DATABASE_CPU_CEILING=$(awk "BEGIN { printf \"%.2f\", $DATABASE_CPU_BASELINE + $DATABASE_CPU_DELTA }")
                    echo "MariaDB pre-migration baseline is ${DATABASE_CPU_BASELINE}% CPU; cooldown ceiling is ${DATABASE_CPU_CEILING}%."
                    return 0
                  fi
                fi
                if [ "$attempt" -lt 12 ]; then sleep 5; fi
                attempt=$((attempt + 1))
              done
              echo "MariaDB pre-migration CPU did not produce three stable consecutive samples in 12 attempts; final window was ${baseline_first}%, ${baseline_second}%, ${baseline_third}%." >&2
              return 1
            }
            wait_for_database_cooldown() {
              cool_samples=0
              attempt=1
              while [ "$attempt" -le 60 ]; do
                cpu=$(read_database_cpu)
                if awk "BEGIN { exit !($cpu <= $DATABASE_CPU_CEILING) }"; then
                  cool_samples=$((cool_samples + 1))
                  echo "MariaDB cooldown sample ${cool_samples}/3: ${cpu}% CPU (baseline ${DATABASE_CPU_BASELINE}%, ceiling ${DATABASE_CPU_CEILING}%)."
                  if [ "$cool_samples" -ge 3 ]; then return 0; fi
                else
                  cool_samples=0
                  echo "MariaDB is still above its pre-migration band: ${cpu}% CPU (ceiling ${DATABASE_CPU_CEILING}%)."
                fi
                attempt=$((attempt + 1))
                sleep 5
              done
              echo "MariaDB did not return to its pre-migration CPU band before server cutover." >&2
              db_container=$(docker compose ps -q db)
              docker stats --no-stream "$db_container" >&2 || true
              docker compose exec -T db sh -c '
                mariadb --user="$MARIADB_USER" --password="$MARIADB_PASSWORD" "$MARIADB_DATABASE" \
                  --execute="SHOW GLOBAL STATUS WHERE Variable_name IN ('\''Threads_connected'\'', '\''Threads_running'\'', '\''Innodb_buffer_pool_pages_dirty'\'');"
              ' >&2 || true
              return 1
            }
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8
            if [ "$APP_IMAGE_TRANSFER_REQUIRED" = true ]; then docker tag "wcarankings-app:${SOURCE_SHA}" wcarankings-app:latest; fi
            if [ "$FLYWAY_IMAGE_TRANSFER_REQUIRED" = true ]; then docker tag "wcarankings-flyway:${SOURCE_SHA}" wcarankings-flyway:latest; fi
            if [ "$DATA_TOOLS_IMAGE_TRANSFER_REQUIRED" = true ]; then docker tag "wcarankings-data-tools:${SOURCE_SHA}" wcarankings-data-tools:latest; fi
            protected_images=$( {
              docker ps -q | xargs -r docker inspect --format "{{.Image}}"
              docker image inspect wcarankings-app:latest wcarankings-app:previous wcarankings-flyway:latest wcarankings-data-tools:latest --format "{{.Id}}" 2>/dev/null || true
            } | sort -u )
            docker images --no-trunc --format "{{.Repository}}:{{.Tag}} {{.ID}}" | while IFS=" " read -r image_ref image_id; do
              case "$image_ref" in
                wcarankings-app:latest|wcarankings-app:previous|wcarankings-flyway:latest|wcarankings-data-tools:latest) continue ;;
                wcarankings-flyway:artifact-*|wcarankings-data-tools:artifact-*) continue ;;
                wcarankings-app:*|wcarankings-flyway:*|wcarankings-data-tools:*) ;;
                *) continue ;;
              esac
              case " $protected_images " in *" $image_id "*) continue ;; esac
              docker image rm "$image_ref" || true
            done
            docker image prune -f
            cd /srv/wcarankings
            if [ "$FLYWAY_IMAGE_CHANGED" = true ] || [ "$DATA_TOOLS_IMAGE_CHANGED" = true ]; then
              measure_database_cpu_baseline
              docker compose run --rm data-tools /app/scripts/prepare-flyway-history.mjs
              docker compose run --rm flyway migrate
              docker compose exec -T db sh -c '
                mariadb --user="$MARIADB_USER" --password="$MARIADB_PASSWORD" "$MARIADB_DATABASE" --execute="
                  CREATE TABLE IF NOT EXISTS result_attempts (
                    result_id BIGINT NOT NULL,
                    attempt_number INT NOT NULL,
                    value INT NOT NULL
                  );
                "
              '
              docker compose run --rm \
                -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
                -e FLYWAY_TABLE=flyway_schema_history_results \
                -e FLYWAY_OUT_OF_ORDER=true \
                flyway migrate
              wait_for_database_cooldown
            fi
            docker compose run --rm data-tools \
              /app/scripts/activate-ranking-generation.mjs bootstrap
          REMOTE
          echo "CANDIDATE_STAGED=true" >> "$GITHUB_ENV"

      - name: Inject failure after migrations
        if: inputs.failure_injection_point == 'after_migrations_before_server_switch'
        run: |
          echo "Injected failure after migrations and before server switch." >&2
          exit 1

      - name: Switch production server
        if: env.APP_SERVICE_CHANGED == 'true' || env.PROXY_CONFIG_CHANGED == 'true'
        run: |
          echo "SERVICES_SWITCHED=true" >> "$GITHUB_ENV"
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "set -eu
            cd /srv/wcarankings
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8
            if [ '$APP_SERVICE_CHANGED' = true ]; then
              DEPLOYED_MAIN_SHA='$SOURCE_SHA' docker compose up -d --no-build --remove-orphans --force-recreate app
            fi
            if [ '$PROXY_CONFIG_CHANGED' = true ] \
              || ! docker compose ps --status running --services | grep -qx proxy; then
              docker compose up -d --no-build --remove-orphans --force-recreate proxy
            fi"

      - name: Inject failure after server switch
        if: inputs.failure_injection_point == 'after_server_switch_before_public_verification'
        run: |
          echo "Injected failure after server switch and before public verification." >&2
          exit 1

      - name: Verify production server
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "PROXY_CONFIG_CHANGED='$PROXY_CONFIG_CHANGED' sh -s" <<'REMOTE'
            set -eu
            cd /srv/wcarankings
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8

            retry_endpoint() {
              endpoint=$1
              attempts=$2
              delay=$3
              label=$4
              output_file=${5:-}
              attempt=1
              while [ "$attempt" -le "$attempts" ]; do
                response_file=$(mktemp)
                status=$(curl --silent --show-error --max-time 15 \
                  --output "$response_file" --write-out "%{http_code}" \
                  "http://127.0.0.1:3000${endpoint}" || true)
                if [ "$status" -ge 200 ] 2>/dev/null && [ "$status" -lt 300 ] 2>/dev/null; then
                  if [ -n "$output_file" ]; then
                    mv "$response_file" "$output_file"
                  else
                    rm -f "$response_file"
                  fi
                  echo "$label passed on attempt $attempt."
                  return 0
                fi
                echo "$label failed on attempt $attempt/$attempts with HTTP ${status:-curl-error}." >&2
                head -c 1000 "$response_file" >&2 || true
                echo >&2
                rm -f "$response_file"
                attempt=$((attempt + 1))
                sleep "$delay"
              done
              return 1
            }

            docker compose ps
            retry_endpoint "/api/health/ready" 30 2 "Readiness"
            # Projection-specific endpoints are verified by deploy-projections
            # after their candidate generation has been activated. Keep this
            # server check limited to the core projection that every server
            # release requires.
            retry_endpoint "/api/rankings?eventId=333&result=single&start=0&limit=1" 10 3 "Core ranking"

            html_file=$(mktemp)
            trap 'rm -f "$html_file"' EXIT
            retry_endpoint "/" 5 2 "SSR root" "$html_file"
            html=$(cat "$html_file")
            rm -f "$html_file"
            trap - EXIT
            css=$(printf "%s" "$html" | sed -n 's/.*href="\([^"]*\.css\)".*/\1/p' | head -n 1)
            if [ -z "$css" ]; then
              echo "SSR response did not include a stylesheet link." >&2
              exit 1
            fi
            case "$css" in
              /assets/*.css) ;;
              assets/*.css) css="/$css" ;;
              *)
                echo "SSR response included an unexpected stylesheet URL: $css" >&2
                exit 1
                ;;
            esac
            retry_endpoint "$css" 5 2 "Stylesheet $css"
          REMOTE

          public_host="${SERVER_HOST#https://}"
          public_host="${public_host#http://}"
          public_host="${public_host%%/*}"
          if [[ ! "$public_host" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "SERVER_HOST must contain a valid hostname." >&2
            exit 1
          fi
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "for attempt in \$(seq 1 30); do
              if curl --fail --silent --show-error --max-time 15 -H 'Host: ${public_host}' http://127.0.0.1/ >/dev/null; then
                exit 0
              fi
              echo 'Public proxy check failed; retrying.' >&2
              sleep 2
            done
            exit 1"

      - name: Capture failed deployment diagnostics
        if: always() && (failure() || cancelled())
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            'cd /srv/wcarankings && docker compose ps && docker compose logs --tail=200 app proxy flyway'

      - name: Restore tag after a pre-switch failure
        if: always() && (failure() || cancelled()) && env.SERVICES_SWITCHED != 'true'
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "APP_IMAGE_CHANGED='$APP_IMAGE_CHANGED' SOURCE_SHA='$SOURCE_SHA' sh -s" <<'REMOTE'
            set -eu
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8
            restore_previous_app_tag() {
              if [ "$APP_IMAGE_CHANGED" != true ]; then
                echo "App image was unchanged; retaining its current latest tag."
                return 0
              fi
              if docker image inspect wcarankings-app:previous >/dev/null 2>&1; then
                docker tag wcarankings-app:previous wcarankings-app:latest
              fi
            }
            restore_previous_app_tag
            restore_staged_config() {
              marker=$1
              release_state=$2
              source_sha=$3
              compose_target=$4
              compose_backup=$5
              caddy_target=$6
              caddy_backup=$7
              if [ ! -f "$marker" ]; then
                echo "This run did not stage deployment configuration; retaining active files."
                return 0
              fi
              if [ -f "$release_state" ] \
                && grep -Eq "\"sourceSha\"[[:space:]]*:[[:space:]]*\"${source_sha}\"" "$release_state"; then
                echo "This run is already approved; removing its stale configuration marker."
                rm -f "$marker"
                return 0
              fi
              if [ -f "$compose_backup" ]; then cp "$compose_backup" "$compose_target"; else rm -f "$compose_target"; fi
              if [ -f "$caddy_backup" ]; then cp "$caddy_backup" "$caddy_target"; else rm -f "$caddy_target"; fi
              rm -f "$marker"
            }
            restore_staged_config \
              "/srv/wcarankings/server-release-${SOURCE_SHA}.config-staging" \
              /srv/wcarankings/server-release-state.json \
              "$SOURCE_SHA" \
              /srv/wcarankings/docker-compose.yml \
              /srv/wcarankings/docker-compose.yml.previous \
              /srv/wcarankings/ops/Caddyfile \
              /srv/wcarankings/ops/Caddyfile.previous
          REMOTE

      - name: Roll back failed server switch
        if: always() && (failure() || cancelled()) && env.SERVICES_SWITCHED == 'true'
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "APP_IMAGE_CHANGED='$APP_IMAGE_CHANGED' \
             PROXY_CONFIG_CHANGED='$PROXY_CONFIG_CHANGED' \
             SOURCE_SHA='$SOURCE_SHA' \
             PREVIOUS_SOURCE_SHA='$PREVIOUS_SOURCE_SHA' sh -s" <<'REMOTE'
            set -eu
            cd /srv/wcarankings
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8
            if [ "$APP_IMAGE_CHANGED" = true ]; then
              if ! docker image inspect wcarankings-app:previous >/dev/null 2>&1; then
                echo "No previous server image is available for rollback." >&2
                exit 1
              fi
              docker tag wcarankings-app:previous wcarankings-app:latest
            fi
            if [ -f docker-compose.yml.previous ]; then
              cp docker-compose.yml.previous docker-compose.yml
            fi
            if [ -f ops/Caddyfile.previous ]; then
              cp ops/Caddyfile.previous ops/Caddyfile
            fi
            if [ -f server-release-state.json.previous ]; then
              cp server-release-state.json.previous server-release-state.json
            else
              rm -f server-release-state.json
            fi
            rm -f "/srv/wcarankings/server-release-${SOURCE_SHA}.config-staging"
            DEPLOYED_MAIN_SHA="$PREVIOUS_SOURCE_SHA" \
              docker compose up -d --no-build --remove-orphans --force-recreate app
            if [ "$PROXY_CONFIG_CHANGED" = true ]; then
              docker compose up -d --no-build --remove-orphans --force-recreate proxy
            fi
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 15 \
                http://127.0.0.1:3000/api/health/ready >/dev/null; then
                curl --fail --silent --show-error --max-time 15 \
                  'http://127.0.0.1:3000/api/rankings?eventId=333&result=single&start=0&limit=1' \
                  >/dev/null
                echo "Rollback readiness check passed."
                exit 0
              fi
              sleep 2
            done
            docker compose logs --tail=200 app proxy
            echo "Rollback did not become ready." >&2
            exit 1
          REMOTE
          echo "ROLLBACK_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Record approved server release
        if: success()
        run: |
          approved=$(jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg appImage "$APP_IMAGE" \
            --arg flywayImage "$FLYWAY_IMAGE" \
            --arg dataToolsImage "$DATA_TOOLS_IMAGE" \
            --arg configChecksum "$CONFIG_CHECKSUM" \
            --arg composeChecksum "$COMPOSE_CHECKSUM" \
            --arg caddyChecksum "$CADDY_CHECKSUM" \
            --arg caddyFileChecksum "$CADDY_FILE_CHECKSUM" \
            '{
              version: 2,
              sourceSha: $sourceSha,
              appImage: $appImage,
              flywayImage: $flywayImage,
              dataToolsImage: $dataToolsImage,
              configChecksum: $configChecksum,
              composeChecksum: $composeChecksum,
              caddyChecksum: $caddyChecksum,
              caddyFileChecksum: $caddyFileChecksum
            }')
          printf '%s\n' "$approved" \
            | ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
                "umask 077; cat > /srv/wcarankings/server-release-state-${SOURCE_SHA}.json.tmp"
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "SOURCE_SHA='$SOURCE_SHA' sh -s" <<'REMOTE'
            set -eu
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8
            mv "/srv/wcarankings/server-release-state-${SOURCE_SHA}.json.tmp" \
              /srv/wcarankings/server-release-state.json
            rm -f "/srv/wcarankings/server-release-${SOURCE_SHA}.config-staging"
          REMOTE

      - name: Roll back a late server release failure
        if: always() && (failure() || cancelled()) && env.SERVICES_SWITCHED == 'true' && env.ROLLBACK_COMPLETED != 'true'
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_IP" \
            "APP_IMAGE_CHANGED='$APP_IMAGE_CHANGED' \
             PROXY_CONFIG_CHANGED='$PROXY_CONFIG_CHANGED' \
             SOURCE_SHA='$SOURCE_SHA' \
             PREVIOUS_SOURCE_SHA='$PREVIOUS_SOURCE_SHA' sh -s" <<'REMOTE'
            set -eu
            cd /srv/wcarankings
            exec 9>/srv/wcarankings/server-release.lock
            flock -w 60 9
            exec 8>/srv/wcarankings/production-mutation.lock
            flock -w 360 8
            if [ "$APP_IMAGE_CHANGED" = true ]; then
              docker tag wcarankings-app:previous wcarankings-app:latest
            fi
            if [ -f docker-compose.yml.previous ]; then cp docker-compose.yml.previous docker-compose.yml; fi
            if [ -f ops/Caddyfile.previous ]; then cp ops/Caddyfile.previous ops/Caddyfile; fi
            if [ -f server-release-state.json.previous ]; then
              cp server-release-state.json.previous server-release-state.json
            else
              rm -f server-release-state.json
            fi
            rm -f "/srv/wcarankings/server-release-${SOURCE_SHA}.config-staging"
            DEPLOYED_MAIN_SHA="$PREVIOUS_SOURCE_SHA" \
              docker compose up -d --no-build --remove-orphans --force-recreate app
            if [ "$PROXY_CONFIG_CHANGED" = true ]; then
              docker compose up -d --no-build --remove-orphans --force-recreate proxy
            fi
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 15 \
                http://127.0.0.1:3000/api/health/ready >/dev/null; then
                curl --fail --silent --show-error --max-time 15 \
                  'http://127.0.0.1:3000/api/rankings?eventId=333&result=single&start=0&limit=1' \
                  >/dev/null
                exit 0
              fi
              sleep 2
            done
            exit 1
          REMOTE

      - name: Summarize server deployment
        if: success()
        run: |
          {
            echo "### Server deployment"
            echo "- Commit: $SOURCE_SHA"
            echo "- App image: $APP_IMAGE"
            echo "- Flyway image: $FLYWAY_IMAGE"
            echo "- Data-tools image: $DATA_TOOLS_IMAGE"
            echo "- Config checksum: $CONFIG_CHECKSUM"
            echo "- Caddy restarted: $PROXY_CONFIG_CHANGED"
            echo "- Previous app image retained for the next rollback."
          } >> "$GITHUB_STEP_SUMMARY"
