name: Build Server Images

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build.
        required: true
        type: string
      force_rebuild:
        description: Build even if source-tree images already exist.
        required: false
        default: false
        type: boolean
      require_existing:
        description: Fail unless verified source-tree images already exist.
        required: false
        default: false
        type: boolean
    outputs:
      source_sha:
        value: ${{ jobs.build.outputs.source_sha }}
      source_tree:
        value: ${{ jobs.build.outputs.source_tree }}
      app_image:
        value: ${{ jobs.build.outputs.app_image }}
      flyway_image:
        value: ${{ jobs.build.outputs.flyway_image }}
      reused:
        value: ${{ jobs.build.outputs.reused }}
      data_tools_image:
        value: ${{ jobs.build.outputs.data_tools_image }}
      config_checksum:
        value: ${{ jobs.build.outputs.config_checksum }}
      compose_checksum:
        value: ${{ jobs.build.outputs.compose_checksum }}
      caddy_checksum:
        value: ${{ jobs.build.outputs.caddy_checksum }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
      app_image: ${{ steps.images.outputs.app }}
      flyway_image: ${{ steps.images.outputs.flyway }}
      data_tools_image: ${{ steps.images.outputs.data_tools }}
      reused: ${{ steps.existing.outputs.available }}
      config_checksum: ${{ steps.config.outputs.config }}
      compose_checksum: ${{ steps.config.outputs.compose }}
      caddy_checksum: ${{ steps.config.outputs.caddy }}

    steps:
      - name: Check out server source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve source identity
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable configuration identity
        id: config
        run: |
          proxy_config=$(env \
            MYSQL_DATABASE=identity \
            MYSQL_USER=identity \
            MYSQL_PASSWORD=identity \
            MYSQL_ROOT_PASSWORD=identity \
            DATABASE_URL=mysql://identity:identity@db:3306/identity \
            docker compose config --no-path-resolution --format json \
              | jq -cS '.services.proxy')
          echo "compose=$(sha256sum docker-compose.yml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          caddy=$( {
            sha256sum ops/Caddyfile
            printf '%s\n' "$proxy_config"
          } | sha256sum | cut -d' ' -f1)
          echo "caddy=$caddy" >> "$GITHUB_OUTPUT"
          echo "config=$(sha256sum docker-compose.yml ops/Caddyfile | sha256sum | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve existing verified images
        id: existing
        env:
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          app="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-app:tree-${SOURCE_TREE}"
          flyway="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-flyway:tree-${SOURCE_TREE}"
          data_tools="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-data-tools:tree-${SOURCE_TREE}"
          if [ "$FORCE_REBUILD" != true ] \
            && docker pull "$app" \
            && docker pull "$flyway" \
            && docker pull "$data_tools"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ '${{ inputs.require_existing }}' = true ]; then
              echo "Verified source-tree images are required; refusing to build during a production release." >&2
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.available != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Flyway image
        if: steps.existing.outputs.available != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.flyway
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wcarankings-flyway:tree-${{ steps.source.outputs.tree }}
            ghcr.io/${{ github.repository_owner }}/wcarankings-flyway:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=tree-${{ steps.source.outputs.tree }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish server image
        if: steps.existing.outputs.available != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wcarankings-app:tree-${{ steps.source.outputs.tree }}
            ghcr.io/${{ github.repository_owner }}/wcarankings-app:sha-${{ steps.source.outputs.sha }}
          build-args: |
            APP_COMMIT_SHA=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=tree-${{ steps.source.outputs.tree }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish data-tools image
        if: steps.existing.outputs.available != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.data-tools
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wcarankings-data-tools:tree-${{ steps.source.outputs.tree }}
            ghcr.io/${{ github.repository_owner }}/wcarankings-data-tools:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=tree-${{ steps.source.outputs.tree }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and verify published images
        id: images
        env:
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          app_tag="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-app:tree-${SOURCE_TREE}"
          flyway_tag="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-flyway:tree-${SOURCE_TREE}"
          data_tools_tag="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wcarankings-data-tools:tree-${SOURCE_TREE}"
          docker pull "$app_tag"
          docker pull "$flyway_tag"
          docker pull "$data_tools_tag"
          app=$(docker image inspect "$app_tag" --format '{{index .RepoDigests 0}}')
          flyway=$(docker image inspect "$flyway_tag" --format '{{index .RepoDigests 0}}')
          data_tools=$(docker image inspect "$data_tools_tag" --format '{{index .RepoDigests 0}}')
          test -n "$app"
          test -n "$flyway"
          test -n "$data_tools"
          docker run --rm --entrypoint sh "$app" -c \
            'test -f /app/docker-entrypoint.sh && test -f /app/release-compatibility.json && test ! -d /app/sql && test ! -f /app/scripts/sync-wca-export.mjs && css=$(find /app/dist/standalone/dist/client -name "*.css" -type f -print -quit) && test -n "$css" && test -s "$css"'
          docker run --rm --entrypoint sh "$flyway" -c \
            'test -f /flyway/migrations/app/V1__export_metadata.sql && test -f /flyway/migrations/app/V9__ranking_generation_state.sql && test -f /flyway/migrations/results/V8__result_attempts_lookup.sql'
          docker run --rm --entrypoint sh "$data_tools" -c \
            'test -f /app/release-compatibility.json && test -f /app/scripts/activate-ranking-generation.mjs && test -f /app/scripts/publish-projection-transfer.mjs && test -f /app/scripts/sync-wca-export.mjs'
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "flyway=$flyway" >> "$GITHUB_OUTPUT"
          echo "data_tools=$data_tools" >> "$GITHUB_OUTPUT"
          {
            echo "### Server images"
            echo "- Source tree: $SOURCE_TREE"
            echo "- Reused: ${{ steps.existing.outputs.available }}"
            echo "- App: $app"
            echo "- Flyway: $flyway"
            echo "- Data tools: $data_tools"
            echo "- Config checksum: ${{ steps.config.outputs.config }}"
          } >> "$GITHUB_STEP_SUMMARY"
