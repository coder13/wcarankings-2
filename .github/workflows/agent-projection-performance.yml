name: Agent Projection Performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/projection-pipeline-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/projection-pipeline-performance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare generated workflow sources
        run: |
          node scripts/apply-projection-correctness-patches.mjs
          node scripts/apply-projection-correctness-test-patches.mjs
          node scripts/apply-shared-export-cache-patch.mjs
          node scripts/apply-bulk-transfer-integration-patch.mjs
          if ! grep -q 'Stage exact generation directly from GHCR' .github/workflows/deploy-projections.yml; then
            node scripts/apply-direct-ghcr-deploy-patch.mjs
          fi
          node scripts/apply-direct-ghcr-deploy-test-patches.mjs
      - name: Extract deployment and transfer scripts
        run: node scripts/extract-projection-workflow-scripts.mjs
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/*.mjs
      - run: bash -n scripts/run-projection-deployment.sh scripts/test-bulk-projection-transfer.sh
      - run: node --test tests/projection-release-artifact.test.mjs tests/projection-architecture.test.mjs tests/projection-transfer.test.mjs tests/deploy-workflow.test.mjs
      - name: Commit validated non-workflow changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset -- .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract projection deployment scripts [skip ci]'
          git push origin HEAD:agent/projection-pipeline-performance
