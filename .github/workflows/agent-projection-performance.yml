name: Agent Projection Performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/projection-pipeline-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/projection-pipeline-performance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply repository patches
        continue-on-error: true
        run: node scripts/apply-projection-performance-patches.mjs
      - name: Update architecture tests
        continue-on-error: true
        run: node scripts/apply-projection-performance-test-patches.mjs
      - name: Preserve projection semantics
        run: |
          node scripts/apply-projection-correctness-patches.mjs
          node scripts/apply-projection-correctness-test-patches.mjs
      - name: Prepare one shared WCA export cache
        run: node scripts/apply-shared-export-cache-patch.mjs
      - name: Add bulk transfer integration coverage
        run: node scripts/apply-bulk-transfer-integration-patch.mjs
      - name: Apply direct GHCR deployment patch
        run: |
          if ! grep -q 'Stage exact generation directly from GHCR' .github/workflows/deploy-projections.yml; then
            sed -i '1i const prefix = "${prefix}"; const required_db_kib = "${required_db_kib}"; const available_db_kib = "${available_db_kib}"; const required_tmp_kib = "${required_tmp_kib}"; const available_tmp_kib = "${available_tmp_kib}"; const SERVER_IP = "${SERVER_IP}"; const SERVER_USER = "${SERVER_USER}"; const ARTIFACT_ID = "${ARTIFACT_ID}";' scripts/apply-direct-ghcr-deploy-patch.mjs
            node scripts/apply-direct-ghcr-deploy-patch.mjs
          fi
          node scripts/apply-direct-ghcr-deploy-test-patches.mjs
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/*.mjs
      - run: node --test tests/projection-release-artifact.test.mjs tests/projection-architecture.test.mjs tests/projection-transfer.test.mjs tests/deploy-workflow.test.mjs
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete projection pipeline performance implementation [skip ci]'
          git push origin HEAD:agent/projection-pipeline-performance
