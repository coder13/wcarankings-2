name: Build and Deploy Labeled PR Projections

on:
  pull_request:
    types:
      - labeled
      - closed

permissions:
  actions: write
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  plan_pr_projections:
    if: >-
      github.event.action == 'labeled'
      && github.event.label.name == 'build-projections'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/plan-projections.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      force_rebuild: true
    secrets: inherit

  build_pr_projections:
    if: >-
      github.event.action == 'labeled'
      && github.event.label.name == 'build-projections'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: plan_pr_projections
    uses: ./.github/workflows/build-projections.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      export_date: ${{ needs.plan_pr_projections.outputs.export_date }}
      export_value: ${{ needs.plan_pr_projections.outputs.export_value }}
      groups: ${{ needs.plan_pr_projections.outputs.groups }}
      fingerprints: ${{ needs.plan_pr_projections.outputs.fingerprints }}
      include_raw: true
      artifact_retention_days: 90
    secrets: inherit

  locate_merged_pr_artifact:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'build-projections')
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.find.outputs.artifact_id }}
      artifact_name: ${{ steps.find.outputs.artifact_name }}
      artifact_run_id: ${{ steps.find.outputs.artifact_run_id }}
      export_date: ${{ steps.manifest.outputs.export_date }}
      export_value: ${{ steps.manifest.outputs.export_value }}
      groups: ${{ steps.manifest.outputs.groups }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
      source_sha: ${{ steps.manifest.outputs.source_sha }}
    steps:
      - name: Find the successful labeled PR build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          runs=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pr-projection-release.yml/runs?event=pull_request&per_page=100")
          run_id=$(jq -r --arg sha "$HEAD_SHA" \
            '[.[].workflow_runs[]
              | select(.head_sha == $sha and .conclusion == "success")
            ] | sort_by(.run_started_at) | (last // {}) | .id // empty' <<<"$runs")
          if [ -z "$run_id" ]; then
            echo "No successful build-projections run was found for PR head $HEAD_SHA." >&2
            exit 1
          fi
          artifacts=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")
          artifact=$(jq -c \
            '[.artifacts[]
              | select(.expired == false and (.name | startswith("projection-release-")))
            ] | sort_by(.created_at) | (last // {})' <<<"$artifacts")
          artifact_id=$(jq -r '.id // empty' <<<"$artifact")
          artifact_name=$(jq -r '.name // empty' <<<"$artifact")
          if [ -z "$artifact_id" ] || [ -z "$artifact_name" ]; then
            echo "The successful PR build did not publish a projection artifact." >&2
            exit 1
          fi
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the exact projection release
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find.outputs.artifact_name }}
          run-id: ${{ steps.find.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/projection-release

      - name: Read and checksum the release manifest
        id: manifest
        run: |
          set -euo pipefail
          manifest=/tmp/projection-release/projection-release.json
          test -s "$manifest"
          echo "export_date=$(jq -r '.exportDate' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "export_value=$(jq -r '.exportId' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "groups=$(jq -r '.groups | keys | join(",")' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum "$manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r '.sourceSha' "$manifest")" >> "$GITHUB_OUTPUT"

  resolve_approved_data_tools:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'build-projections')
    uses: ./.github/workflows/resolve-approved-data-tools.yml
    secrets: inherit

  plan_merged_pr_environment:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'build-projections')
    uses: ./.github/workflows/plan-projections.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    secrets: inherit

  deploy_merged_pr_projections:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'build-projections')
      && needs.locate_merged_pr_artifact.result == 'success'
      && needs.resolve_approved_data_tools.result == 'success'
      && needs.plan_merged_pr_environment.result == 'success'
    needs:
      - locate_merged_pr_artifact
      - resolve_approved_data_tools
      - plan_merged_pr_environment
    uses: ./.github/workflows/deploy-projections.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      artifact_name: ${{ needs.locate_merged_pr_artifact.outputs.artifact_name }}
      artifact_run_id: ${{ needs.locate_merged_pr_artifact.outputs.artifact_run_id }}
      artifact_id: ${{ needs.locate_merged_pr_artifact.outputs.artifact_id }}
      manifest_sha256: ${{ needs.locate_merged_pr_artifact.outputs.manifest_sha256 }}
      groups: ${{ needs.locate_merged_pr_artifact.outputs.groups }}
      export_date: ${{ needs.locate_merged_pr_artifact.outputs.export_date }}
      export_value: ${{ needs.locate_merged_pr_artifact.outputs.export_value }}
      production_export_value: ${{ needs.plan_merged_pr_environment.outputs.production_export_value }}
      source_sha: ${{ needs.locate_merged_pr_artifact.outputs.source_sha }}
      data_tools_image: ${{ needs.resolve_approved_data_tools.outputs.data_tools_image }}
    secrets: inherit
