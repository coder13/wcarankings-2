name: Build Labeled PR Projections

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: pr-projection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: >-
      github.repository == 'coder13/wcarankings-2'
      && github.event.label.name == 'build-projections'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/plan-projections.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      force_rebuild: true
      bypass_artifact_cache: true
    secrets: inherit

  build:
    name: Build Projection Artifacts
    if: needs.plan.outputs.required == 'true'
    needs: plan
    uses: ./.github/workflows/build-projections.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      export_date: ${{ needs.plan.outputs.export_date }}
      export_value: ${{ needs.plan.outputs.export_value }}
      release_groups: ${{ needs.plan.outputs.release_groups }}
      build_groups: ${{ needs.plan.outputs.build_groups }}
      hydrate_groups: ${{ needs.plan.outputs.hydrate_groups }}
      fingerprints: ${{ needs.plan.outputs.fingerprints }}
      available_artifacts: ${{ needs.plan.outputs.available_artifacts }}
      include_raw: ${{ needs.plan.outputs.raw_required == 'true' }}
      run_benchmark: true
    secrets: inherit
