name: Build Incremental Projection Artifacts

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      export_date:
        required: true
        type: string
      export_value:
        required: true
        type: string
      release_groups:
        required: true
        type: string
      build_groups:
        required: false
        default: ""
        type: string
      hydrate_groups:
        required: false
        default: ""
        type: string
      fingerprints:
        required: true
        type: string
      available_artifacts:
        required: false
        default: "{}"
        type: string
      include_raw:
        required: false
        default: false
        type: boolean
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
      manifest_sha256:
        value: ${{ jobs.build.outputs.manifest_sha256 }}
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_run_id:
        value: ${{ github.run_id }}
      source_sha:
        value: ${{ jobs.build.outputs.source_sha }}
      artifact_digests:
        value: ${{ jobs.build.outputs.artifact_digests }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release.outputs.name }}
      manifest_sha256: ${{ steps.release.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_digests: ${{ steps.publish.outputs.digests }}
    env:
      MYSQL_DATABASE: wcarankings
      MYSQL_USER: wcarankings
      MYSQL_PASSWORD: projection-build
      MYSQL_ROOT_PASSWORD: projection-build-root
      DATABASE_URL: mysql://wcarankings:projection-build@127.0.0.1:13307/wcarankings
      WCA_EXPORT_CACHE_DIR: /tmp/wca-export-cache
      RELEASE_DIR: /tmp/projection-release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - uses: oras-project/setup-oras@v1

      - name: Authenticate immutable projection storage
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Restore exact cached and hydration artifacts by digest
        env:
          AVAILABLE_ARTIFACTS: ${{ inputs.available_artifacts }}
          RELEASE_GROUPS: ${{ inputs.release_groups }}
          HYDRATE_GROUPS: ${{ inputs.hydrate_groups }}
          FINGERPRINTS: ${{ inputs.fingerprints }}
        run: |
          printf '%s\n' "$AVAILABLE_ARTIFACTS" > /tmp/available-artifacts.json
          printf '{"groups":%s}\n' "$FINGERPRINTS" > /tmp/fingerprints.json
          mkdir -p /tmp/restored "$RELEASE_DIR"
          for group in $(printf '%s,%s' "$RELEASE_GROUPS" "$HYDRATE_GROUPS" | tr ',' '\n' | sort -u); do
            [ -n "$group" ] || continue
            ref=$(jq -r --arg group "$group" '.[$group].ref // empty' /tmp/available-artifacts.json)
            digest=$(jq -r --arg group "$group" '.[$group].digest // empty' /tmp/available-artifacts.json)
            [ -n "$ref" ] && [ -n "$digest" ] || continue
            repository=${ref%%:*}
            oras pull "${repository}@${digest}" -o "/tmp/restored/${group}"
            node scripts/projection-release-artifact.mjs verify \
              --directory="/tmp/restored/${group}" --groups="$group" \
              --export-id="${{ inputs.export_value }}" \
              --fingerprints-file=/tmp/fingerprints.json
          done

      - name: Restore WCA SQL export
        if: inputs.build_groups != '' || inputs.include_raw
        id: wca-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}

      - name: Download WCA SQL export on raw cache miss
        if: (inputs.build_groups != '' || inputs.include_raw) && steps.wca-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/wca-export-cache
          node scripts/sync-wca-export.mjs --dry-run

      - name: Save WCA SQL export
        if: (inputs.build_groups != '' || inputs.include_raw) && steps.wca-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}

      - name: Build only cache-miss groups with hydrated dependencies
        if: inputs.build_groups != ''
        env:
          BUILD_GROUPS: ${{ inputs.build_groups }}
          HYDRATE_GROUPS: ${{ inputs.hydrate_groups }}
        run: |
          set -euo pipefail
          docker compose up -d db
          until docker compose exec -T db mariadb-admin ping -h 127.0.0.1 \
            -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; do sleep 2; done
          docker compose exec -T db mariadb --user="$MYSQL_USER" --password="$MYSQL_PASSWORD" \
            "$MYSQL_DATABASE" --execute="CREATE TABLE IF NOT EXISTS export_metadata (\`key\` VARCHAR(64) NOT NULL PRIMARY KEY, \`value\` TEXT NOT NULL); CREATE TABLE IF NOT EXISTS result_attempts (result_id BIGINT NOT NULL, attempt_number INT NOT NULL)"
          docker compose run --rm flyway migrate
          docker compose run --rm -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
            -e FLYWAY_TABLE=flyway_schema_history_results flyway migrate
          node scripts/sync-wca-export.mjs --force --raw-only \
            --sql-path="/tmp/wca-export-cache/wca-export-${{ inputs.export_date }}.sql.zip" \
            --canonical-export-date="${{ inputs.export_value }}"

          for group in $(printf '%s' "$HYDRATE_GROUPS" | tr ',' ' '); do
            archive=$(jq -r --arg group "$group" '.groups[$group].archive.file' \
              "/tmp/restored/${group}/projection-release.json")
            gzip -dc "/tmp/restored/${group}/${archive}" | MYSQL_PWD="$MYSQL_PASSWORD" mariadb \
              --protocol=TCP --host=127.0.0.1 --port=13307 --user="$MYSQL_USER" "$MYSQL_DATABASE"
            node scripts/publish-projection-transfer.mjs --hydrate --groups="$group" \
              --expected-export-date="${{ inputs.export_value }}"
          done

          node scripts/projection-build-plan.mjs --groups="$BUILD_GROUPS" \
            --satisfied-groups="$HYDRATE_GROUPS" > /tmp/build-plan.json
          WCA_PROJECTION_BUILD_CONCURRENCY=2 node scripts/build-projection-groups.mjs \
            --projection-names="$(jq -r '.projectionNames | join(",")' /tmp/build-plan.json)" \
            --satisfied-projection-names="$(jq -r '.satisfiedProjectionNames | join(",")' /tmp/build-plan.json)" \
            --include-compatibility="$(jq -r '.includeCompatibility' /tmp/build-plan.json)"

          for group in $(printf '%s' "$BUILD_GROUPS" | tr ',' ' '); do
            directory="/tmp/built/${group}"
            mkdir -p "$directory"
            prefix="$group"
            if [ "$group" = yearly-person-rankings ]; then prefix=yearly; fi
            node scripts/prepare-projection-transfer.mjs --group="$group" \
              > "$directory/${prefix}-projection-transfer.json"
            mapfile -t tables < <(jq -r '.tables[]' "$directory/${prefix}-projection-transfer.json")
            MYSQL_PWD="$MYSQL_PASSWORD" mariadb-dump --protocol=TCP --host=127.0.0.1 --port=13307 \
              --user="$MYSQL_USER" --single-transaction --skip-lock-tables \
              "$MYSQL_DATABASE" "${tables[@]}" | gzip -1 \
              > "$directory/${prefix}-projection-transfer.sql.gz"
          done

      - name: Publish newly built group artifacts to GHCR
        if: inputs.build_groups != ''
        id: publish
        env:
          BUILD_GROUPS: ${{ inputs.build_groups }}
          FINGERPRINTS: ${{ inputs.fingerprints }}
          AVAILABLE_ARTIFACTS: ${{ inputs.available_artifacts }}
        run: |
          printf '{"groups":%s}\n' "$FINGERPRINTS" > /tmp/fingerprints.json
          printf '{}\n' > /tmp/artifact-digests.json
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for group in $(printf '%s' "$BUILD_GROUPS" | tr ',' ' '); do
            directory="/tmp/built/${group}"
            node scripts/projection-release-artifact.mjs create --directory="$directory" \
              --export-id="${{ inputs.export_value }}" --export-date="${{ inputs.export_date }}" \
              --groups="$group" --fingerprints-file=/tmp/fingerprints.json \
              --compatibility-file=release-compatibility.json --source-sha="${{ steps.source.outputs.sha }}"
            fingerprint=$(jq -r --arg group "$group" '.groups[$group].artifactFingerprint' /tmp/fingerprints.json)
            corrupt=$(jq -r --arg group "$group" '.[$group].valid == false' <<<"$AVAILABLE_ARTIFACTS")
            tag="$fingerprint"
            if [ "$corrupt" = true ]; then tag="${fingerprint}-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
            ref="ghcr.io/${owner}/wcarankings-projection-${group}:${tag}"
            archive=$(jq -r --arg group "$group" '.groups[$group].archive.file' "$directory/projection-release.json")
            metadata=$(jq -r --arg group "$group" '.groups[$group].metadata.file' "$directory/projection-release.json")
            # ORAS rejects absolute file paths. Publish from the artifact directory so
            # every file reference remains relative even as ORAS tightens validation.
            pushd "$directory" >/dev/null
            oras push "$ref" --artifact-type application/vnd.cuberanks.projection.group.v3 \
              "projection-release.json:application/vnd.cuberanks.projection.manifest.v3+json" \
              "$archive:application/vnd.cuberanks.projection.sql+gzip" \
              "$metadata:application/vnd.cuberanks.projection.transfer+json"
            popd >/dev/null
            digest=$(oras manifest fetch --descriptor "$ref" | jq -r '.digest')
            jq --arg group "$group" --arg digest "$digest" '.[$group] = $digest' \
              /tmp/artifact-digests.json > /tmp/artifact-digests.next
            mv /tmp/artifact-digests.next /tmp/artifact-digests.json
          done
          echo "digests=$(jq -c . /tmp/artifact-digests.json)" >> "$GITHUB_OUTPUT"

      - name: Compose exact production release bundle
        id: release
        env:
          RELEASE_GROUPS: ${{ inputs.release_groups }}
          BUILD_GROUPS: ${{ inputs.build_groups }}
          FINGERPRINTS: ${{ inputs.fingerprints }}
          AVAILABLE_ARTIFACTS: ${{ inputs.available_artifacts }}
        run: |
          mkdir -p "$RELEASE_DIR"
          printf '{"groups":%s}\n' "$FINGERPRINTS" > /tmp/fingerprints.json
          printf '{}\n' > /tmp/release-digests.json
          for group in $(printf '%s' "$RELEASE_GROUPS" | tr ',' ' '); do
            source="/tmp/restored/${group}"
            if printf ',%s,' "$BUILD_GROUPS" | grep -q ",$group,"; then source="/tmp/built/${group}"; fi
            archive=$(jq -r --arg group "$group" '.groups[$group].archive.file' "$source/projection-release.json")
            metadata=$(jq -r --arg group "$group" '.groups[$group].metadata.file' "$source/projection-release.json")
            cp "$source/$archive" "$source/$metadata" "$RELEASE_DIR/"
            digest=$(jq -r --arg group "$group" '.[$group] // empty' /tmp/artifact-digests.json 2>/dev/null || true)
            if [ -z "$digest" ]; then digest=$(jq -r --arg group "$group" '.[$group].digest' <<<"$AVAILABLE_ARTIFACTS"); fi
            jq --arg group "$group" --arg digest "$digest" '.[$group] = $digest' \
              /tmp/release-digests.json > /tmp/release-digests.next
            mv /tmp/release-digests.next /tmp/release-digests.json
          done
          raw=()
          if [ '${{ inputs.include_raw }}' = true ]; then
            cp "/tmp/wca-export-cache/wca-export-${{ inputs.export_date }}.sql.zip" "$RELEASE_DIR/wca-export.sql.zip"
            raw+=(--raw-file=wca-export.sql.zip)
          fi
          result=$(node scripts/projection-release-artifact.mjs create --directory="$RELEASE_DIR" \
            --export-id="${{ inputs.export_value }}" --export-date="${{ inputs.export_date }}" \
            --groups="$RELEASE_GROUPS" --fingerprints-file=/tmp/fingerprints.json \
            --artifact-digests-file=/tmp/release-digests.json \
            --compatibility-file=release-compatibility.json --source-sha="${{ steps.source.outputs.sha }}" \
            "${raw[@]}")
          echo "name=projection-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r '.sha256' <<<"$result")" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.name }}
          path: /tmp/projection-release
          if-no-files-found: error
          retention-days: 7

      - name: Clean runner database
        if: always() && inputs.build_groups != ''
        run: docker compose down --volumes --remove-orphans
