name: Build Projection Artifacts

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      export_date:
        required: true
        type: string
      export_value:
        required: true
        type: string
      release_groups:
        required: true
        type: string
      build_groups:
        required: false
        default: ""
        type: string
      hydrate_groups:
        required: false
        default: ""
        type: string
      fingerprints:
        required: true
        type: string
      available_artifacts:
        required: false
        default: "{}"
        type: string
      include_raw:
        required: false
        default: false
        type: boolean
      run_benchmark:
        description: Run the ranking scroll benchmark against the generated database.
        required: false
        default: false
        type: boolean
    outputs:
      artifact_name:
        value: ${{ jobs.compose.outputs.artifact_name }}
      manifest_sha256:
        value: ${{ jobs.compose.outputs.manifest_sha256 }}
      artifact_id:
        value: ${{ jobs.compose.outputs.artifact_id }}
      artifact_run_id:
        value: ${{ github.run_id }}
      source_sha:
        value: ${{ jobs.compose.outputs.source_sha }}

permissions:
  contents: read
  packages: write

jobs:
  raw-export:
    name: Prepare Raw Export
    runs-on: ubuntu-latest
    env:
      WCA_EXPORT_CACHE_DIR: /tmp/wca-export-cache
    steps:
      - uses: actions/checkout@v4
        if: inputs.build_groups != '' || inputs.include_raw
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        if: inputs.build_groups != '' || inputs.include_raw
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: inputs.build_groups != '' || inputs.include_raw
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install export tooling
        if: inputs.build_groups != '' || inputs.include_raw
        run: pnpm install --frozen-lockfile --prod

      - name: Restore WCA SQL export
        if: inputs.build_groups != '' || inputs.include_raw
        id: wca-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}

      - name: Download WCA SQL export on cache miss
        if: (inputs.build_groups != '' || inputs.include_raw) && steps.wca-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/wca-export-cache
          node scripts/sync-wca-export.mjs --dry-run

      - name: Save WCA SQL export
        if: (inputs.build_groups != '' || inputs.include_raw) && steps.wca-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}

  build:
    name: Build Projection Groups
    if: inputs.build_groups != ''
    needs: raw-export
    uses: ./.github/workflows/build-projection-group.yml
    with:
      ref: ${{ inputs.ref }}
      export_date: ${{ inputs.export_date }}
      export_value: ${{ inputs.export_value }}
      groups: ${{ inputs.build_groups }}
      hydrate_groups: ${{ inputs.hydrate_groups }}
      fingerprints: ${{ inputs.fingerprints }}
      available_artifacts: ${{ inputs.available_artifacts }}
      run_benchmark: ${{ inputs.run_benchmark }}
    secrets: inherit

  compose:
    name: Publish Projection Release
    if: >-
      always()
      && needs.raw-export.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: [raw-export, build]
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release.outputs.name }}
      manifest_sha256: ${{ steps.release.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      WCA_EXPORT_CACHE_DIR: /tmp/wca-export-cache
      RELEASE_DIR: /tmp/projection-release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@v1

      - name: Sign In to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Restore raw WCA export for release
        if: inputs.include_raw
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}
          fail-on-cache-miss: true

      - name: Find Exact Projection Artifact References
        env:
          RELEASE_GROUPS: ${{ inputs.release_groups }}
          BUILD_GROUPS: ${{ inputs.build_groups }}
          FINGERPRINTS: ${{ inputs.fingerprints }}
          AVAILABLE_ARTIFACTS: ${{ inputs.available_artifacts }}
        run: |
          set -euo pipefail
          printf '{"groups":%s}\n' "$FINGERPRINTS" > /tmp/fingerprints.json
          printf '%s\n' "$AVAILABLE_ARTIFACTS" > /tmp/available-artifacts.json
          printf '{}\n' > /tmp/coordinates.json
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for group in $(printf '%s' "$RELEASE_GROUPS" | tr ',' ' '); do
            ref=$(jq -r --arg group "$group" '.[$group].ref // empty' /tmp/available-artifacts.json)
            digest=$(jq -r --arg group "$group" '.[$group].digest // empty' /tmp/available-artifacts.json)
            if printf ',%s,' "$BUILD_GROUPS" | grep -q ",$group,"; then
              fingerprint=$(jq -r --arg group "$group" '.groups[$group].artifactFingerprint' /tmp/fingerprints.json)
              corrupt=$(jq -r --arg group "$group" '.[$group].valid == false' /tmp/available-artifacts.json)
              tag="$fingerprint"
              if [ "$corrupt" = true ]; then tag="${fingerprint}-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
              tagged_ref="ghcr.io/${owner}/wcarankings-projection-${group}:${tag}"
              digest=$(oras manifest fetch --descriptor "$tagged_ref" | jq -r '.digest')
              ref="ghcr.io/${owner}/wcarankings-projection-${group}"
            else
              ref=${ref%%:*}
            fi
            test -n "$ref" && test -n "$digest"
            jq --arg group "$group" --arg ref "${ref}@${digest}" --arg digest "$digest" \
              '.[$group] = {ref:$ref, digest:$digest}' /tmp/coordinates.json \
              > /tmp/coordinates.next
            mv /tmp/coordinates.next /tmp/coordinates.json
          done

      - name: Publish Raw Export Artifact
        if: inputs.include_raw
        id: raw
        run: |
          set -euo pipefail
          raw="/tmp/wca-export-cache/wca-export-${{ inputs.export_date }}.sql.zip"
          test -f "$raw"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          identity=$(printf '%s' '${{ inputs.export_value }}' | sha256sum | cut -d' ' -f1)
          tagged_ref="ghcr.io/${owner}/wcarankings-wca-export:${identity}"
          directory=$(dirname "$raw")
          file=$(basename "$raw")
          pushd "$directory" >/dev/null
          oras push "$tagged_ref" \
            --artifact-type application/vnd.cuberanks.wca-export.v1 \
            --annotation "io.wcarankings.export-id=${{ inputs.export_value }}" \
            "$file:application/vnd.cuberanks.wca-export.sql+zip"
          popd >/dev/null
          digest=$(oras manifest fetch --descriptor "$tagged_ref" | jq -r '.digest')
          bytes=$(stat -c %s "$raw")
          checksum=$(sha256sum "$raw" | cut -d' ' -f1)
          jq -n --arg ref "ghcr.io/${owner}/wcarankings-wca-export@${digest}" \
            --arg digest "$digest" --arg file "$file" --arg sha256 "$checksum" \
            --argjson bytes "$bytes" \
            '{ref:$ref,digest:$digest,file:$file,bytes:$bytes,sha256:$sha256}' \
            > /tmp/raw-coordinate.json

      - name: Create Projection Release File
        id: release
        env:
          RELEASE_GROUPS: ${{ inputs.release_groups }}
          FINGERPRINTS: ${{ inputs.fingerprints }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          printf '{"groups":%s}\n' "$FINGERPRINTS" > /tmp/fingerprints.json
          raw=()
          if [ '${{ inputs.include_raw }}' = true ]; then raw+=(--raw-file=/tmp/raw-coordinate.json); fi
          result=$(node scripts/projection-release-coordinate.mjs create \
            --directory="$RELEASE_DIR" \
            --export-id="${{ inputs.export_value }}" \
            --export-date="${{ inputs.export_date }}" \
            --groups="$RELEASE_GROUPS" \
            --fingerprints-file=/tmp/fingerprints.json \
            --coordinates-file=/tmp/coordinates.json \
            --compatibility-file=release-compatibility.json \
            --source-sha="${{ steps.source.outputs.sha }}" \
            "${raw[@]}")
          echo "name=projection-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r '.sha256' <<<"$result")" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.name }}
          path: /tmp/projection-release/projection-release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  benchmark:
    name: Measure Ranking Performance
    if: >-
      always()
      && inputs.run_benchmark == true
      && inputs.build_groups != ''
      && needs.raw-export.result == 'success'
      && needs.build.result == 'success'
      && needs.compose.result == 'success'
    needs: [raw-export, build, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Run ranking scroll benchmark
        env:
          BENCHMARK_STATUS: ${{ needs.build.outputs.benchmark_status }}
        run: |
          set -euo pipefail
          echo "Integrated benchmark status: ${BENCHMARK_STATUS:-missing}"
          test "${BENCHMARK_STATUS:-missing}" = 0
