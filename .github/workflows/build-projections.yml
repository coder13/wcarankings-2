name: Build Incremental Projection Artifacts

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      export_date:
        required: true
        type: string
      export_value:
        required: true
        type: string
      release_groups:
        required: true
        type: string
      build_groups:
        required: false
        default: ""
        type: string
      hydrate_groups:
        required: false
        default: ""
        type: string
      fingerprints:
        required: true
        type: string
      available_artifacts:
        required: false
        default: "{}"
        type: string
      include_raw:
        required: false
        default: false
        type: boolean
      run_benchmark:
        description: Run the ranking scroll benchmark against the generated database.
        required: false
        default: false
        type: boolean
    outputs:
      artifact_name:
        value: ${{ jobs.compose.outputs.artifact_name }}
      manifest_sha256:
        value: ${{ jobs.compose.outputs.manifest_sha256 }}
      artifact_id:
        value: ${{ jobs.compose.outputs.artifact_id }}
      artifact_run_id:
        value: ${{ github.run_id }}
      source_sha:
        value: ${{ jobs.compose.outputs.source_sha }}

permissions:
  contents: read
  packages: write

jobs:
  raw-export:
    runs-on: ubuntu-latest
    env:
      WCA_EXPORT_CACHE_DIR: /tmp/wca-export-cache
    steps:
      - uses: actions/checkout@v4
        if: inputs.build_groups != '' || inputs.include_raw
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        if: inputs.build_groups != '' || inputs.include_raw
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: inputs.build_groups != '' || inputs.include_raw
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install export tooling
        if: inputs.build_groups != '' || inputs.include_raw
        run: pnpm install --frozen-lockfile --prod

      - name: Restore WCA SQL export
        if: inputs.build_groups != '' || inputs.include_raw
        id: wca-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}

      - name: Download WCA SQL export on cache miss
        if: (inputs.build_groups != '' || inputs.include_raw) && steps.wca-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/wca-export-cache
          node scripts/sync-wca-export.mjs --dry-run

      - name: Save WCA SQL export
        if: (inputs.build_groups != '' || inputs.include_raw) && steps.wca-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}

  matrix:
    runs-on: ubuntu-latest
    outputs:
      wave_one: ${{ steps.plan.outputs.wave_one }}
      wave_two: ${{ steps.plan.outputs.wave_two }}
      wave_two_required: ${{ steps.plan.outputs.wave_two_required }}
      wave_three: ${{ steps.plan.outputs.wave_three }}
      wave_three_required: ${{ steps.plan.outputs.wave_three_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Plan isolated build waves
        id: plan
        env:
          BUILD_GROUPS: ${{ inputs.build_groups }}
        run: |
          wave_one=$(node scripts/projection-build-matrix.mjs --wave=1)
          wave_two=$(node scripts/projection-build-matrix.mjs --wave=2)
          wave_three=$(node scripts/projection-build-matrix.mjs --wave=3)
          echo "wave_one=$wave_one" >> "$GITHUB_OUTPUT"
          echo "wave_two=$wave_two" >> "$GITHUB_OUTPUT"
          echo "wave_two_required=$(jq -r '.include | length > 0' <<<"$wave_two")" >> "$GITHUB_OUTPUT"
          echo "wave_three=$wave_three" >> "$GITHUB_OUTPUT"
          echo "wave_three_required=$(jq -r '.include | length > 0' <<<"$wave_three")" >> "$GITHUB_OUTPUT"

  wave-one:
    if: inputs.build_groups != ''
    needs: [matrix, raw-export]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.wave_one) }}
    uses: ./.github/workflows/build-projection-group.yml
    with:
      ref: ${{ inputs.ref }}
      export_date: ${{ inputs.export_date }}
      export_value: ${{ inputs.export_value }}
      group: ${{ matrix.group }}
      hydrate_groups: ${{ matrix.hydrate_groups }}
      fingerprints: ${{ inputs.fingerprints }}
      available_artifacts: ${{ inputs.available_artifacts }}
    secrets: inherit

  wave-two:
    if: needs.matrix.outputs.wave_two_required == 'true'
    needs: [matrix, wave-one]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.wave_two) }}
    uses: ./.github/workflows/build-projection-group.yml
    with:
      ref: ${{ inputs.ref }}
      export_date: ${{ inputs.export_date }}
      export_value: ${{ inputs.export_value }}
      group: ${{ matrix.group }}
      hydrate_groups: ${{ matrix.hydrate_groups }}
      fingerprints: ${{ inputs.fingerprints }}
      available_artifacts: ${{ inputs.available_artifacts }}
    secrets: inherit

  wave-three:
    if: needs.matrix.outputs.wave_three_required == 'true'
    needs: [matrix, wave-two]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.wave_three) }}
    uses: ./.github/workflows/build-projection-group.yml
    with:
      ref: ${{ inputs.ref }}
      export_date: ${{ inputs.export_date }}
      export_value: ${{ inputs.export_value }}
      group: ${{ matrix.group }}
      hydrate_groups: ${{ matrix.hydrate_groups }}
      fingerprints: ${{ inputs.fingerprints }}
      available_artifacts: ${{ inputs.available_artifacts }}
    secrets: inherit

  compose:
    if: >-
      always()
      && needs.matrix.result == 'success'
      && needs.raw-export.result == 'success'
      && (needs.wave-one.result == 'success' || needs.wave-one.result == 'skipped')
      && (needs.wave-two.result == 'success' || needs.wave-two.result == 'skipped')
      && (needs.wave-three.result == 'success' || needs.wave-three.result == 'skipped')
    needs: [matrix, raw-export, wave-one, wave-two, wave-three]
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release.outputs.name }}
      manifest_sha256: ${{ steps.release.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      WCA_EXPORT_CACHE_DIR: /tmp/wca-export-cache
      RELEASE_DIR: /tmp/projection-release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@v1

      - name: Authenticate immutable projection storage
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Restore raw WCA export for release
        if: inputs.include_raw
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}
          fail-on-cache-miss: true

      - name: Resolve exact group coordinates
        env:
          RELEASE_GROUPS: ${{ inputs.release_groups }}
          BUILD_GROUPS: ${{ inputs.build_groups }}
          FINGERPRINTS: ${{ inputs.fingerprints }}
          AVAILABLE_ARTIFACTS: ${{ inputs.available_artifacts }}
        run: |
          set -euo pipefail
          printf '{"groups":%s}\n' "$FINGERPRINTS" > /tmp/fingerprints.json
          printf '%s\n' "$AVAILABLE_ARTIFACTS" > /tmp/available-artifacts.json
          printf '{}\n' > /tmp/coordinates.json
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for group in $(printf '%s' "$RELEASE_GROUPS" | tr ',' ' '); do
            ref=$(jq -r --arg group "$group" '.[$group].ref // empty' /tmp/available-artifacts.json)
            digest=$(jq -r --arg group "$group" '.[$group].digest // empty' /tmp/available-artifacts.json)
            if printf ',%s,' "$BUILD_GROUPS" | grep -q ",$group,"; then
              fingerprint=$(jq -r --arg group "$group" '.groups[$group].artifactFingerprint' /tmp/fingerprints.json)
              corrupt=$(jq -r --arg group "$group" '.[$group].valid == false' /tmp/available-artifacts.json)
              tag="$fingerprint"
              if [ "$corrupt" = true ]; then tag="${fingerprint}-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
              tagged_ref="ghcr.io/${owner}/wcarankings-projection-${group}:${tag}"
              digest=$(oras manifest fetch --descriptor "$tagged_ref" | jq -r '.digest')
              ref="ghcr.io/${owner}/wcarankings-projection-${group}"
            else
              ref=${ref%%:*}
            fi
            test -n "$ref" && test -n "$digest"
            jq --arg group "$group" --arg ref "${ref}@${digest}" --arg digest "$digest" \
              '.[$group] = {ref:$ref, digest:$digest}' /tmp/coordinates.json \
              > /tmp/coordinates.next
            mv /tmp/coordinates.next /tmp/coordinates.json
          done

      - name: Publish raw export coordinate
        if: inputs.include_raw
        id: raw
        run: |
          set -euo pipefail
          raw="/tmp/wca-export-cache/wca-export-${{ inputs.export_date }}.sql.zip"
          test -f "$raw"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          identity=$(printf '%s' '${{ inputs.export_value }}' | sha256sum | cut -d' ' -f1)
          tagged_ref="ghcr.io/${owner}/wcarankings-wca-export:${identity}"
          directory=$(dirname "$raw")
          file=$(basename "$raw")
          pushd "$directory" >/dev/null
          oras push "$tagged_ref" \
            --artifact-type application/vnd.cuberanks.wca-export.v1 \
            --annotation "io.wcarankings.export-id=${{ inputs.export_value }}" \
            "$file:application/vnd.cuberanks.wca-export.sql+zip"
          popd >/dev/null
          digest=$(oras manifest fetch --descriptor "$tagged_ref" | jq -r '.digest')
          bytes=$(stat -c %s "$raw")
          checksum=$(sha256sum "$raw" | cut -d' ' -f1)
          jq -n --arg ref "ghcr.io/${owner}/wcarankings-wca-export@${digest}" \
            --arg digest "$digest" --arg file "$file" --arg sha256 "$checksum" \
            --argjson bytes "$bytes" \
            '{ref:$ref,digest:$digest,file:$file,bytes:$bytes,sha256:$sha256}' \
            > /tmp/raw-coordinate.json

      - name: Compose lightweight release coordinate
        id: release
        env:
          RELEASE_GROUPS: ${{ inputs.release_groups }}
          FINGERPRINTS: ${{ inputs.fingerprints }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          printf '{"groups":%s}\n' "$FINGERPRINTS" > /tmp/fingerprints.json
          raw=()
          if [ '${{ inputs.include_raw }}' = true ]; then raw+=(--raw-file=/tmp/raw-coordinate.json); fi
          result=$(node scripts/projection-release-coordinate.mjs create \
            --directory="$RELEASE_DIR" \
            --export-id="${{ inputs.export_value }}" \
            --export-date="${{ inputs.export_date }}" \
            --groups="$RELEASE_GROUPS" \
            --fingerprints-file=/tmp/fingerprints.json \
            --coordinates-file=/tmp/coordinates.json \
            --compatibility-file=release-compatibility.json \
            --source-sha="${{ steps.source.outputs.sha }}" \
            "${raw[@]}")
          echo "name=projection-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r '.sha256' <<<"$result")" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.name }}
          path: /tmp/projection-release/projection-release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  benchmark:
    if: >-
      always()
      && inputs.run_benchmark == true
      && inputs.build_groups != ''
      && needs.raw-export.result == 'success'
      && (needs.wave-one.result == 'success' || needs.wave-one.result == 'skipped')
      && (needs.wave-two.result == 'success' || needs.wave-two.result == 'skipped')
      && (needs.wave-three.result == 'success' || needs.wave-three.result == 'skipped')
    needs: [raw-export, wave-one, wave-two, wave-three]
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: wcarankings
      MYSQL_USER: wcarankings
      MYSQL_PASSWORD: projection-build
      MYSQL_ROOT_PASSWORD: projection-build-root
      DATABASE_URL: mysql://wcarankings:projection-build@127.0.0.1:13307/wcarankings
      WCA_EXPORT_CACHE_DIR: /tmp/wca-export-cache
      BENCHMARK_REPORT_DIR: benchmark-reports
      BUILD_GROUPS: ${{ inputs.build_groups }}
      FINGERPRINTS: ${{ inputs.fingerprints }}
      AVAILABLE_ARTIFACTS: ${{ inputs.available_artifacts }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prod

      - uses: oras-project/setup-oras@v1

      - name: Authenticate immutable projection storage
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Restore WCA SQL export
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wca-export-cache
          key: wca-sql-export-${{ inputs.export_date }}
          fail-on-cache-miss: true

      - name: Import generated projection groups
        run: |
          set -euo pipefail
          printf '{"groups":%s}\n' "$FINGERPRINTS" > /tmp/fingerprints.json
          printf '%s\n' "$AVAILABLE_ARTIFACTS" > /tmp/available-artifacts.json
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          docker compose up -d db
          until docker compose exec -T db mariadb-admin ping -h 127.0.0.1 \
            -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; do sleep 2; done
          docker compose exec -T db mariadb --user="$MYSQL_USER" --password="$MYSQL_PASSWORD" \
            "$MYSQL_DATABASE" --execute="CREATE TABLE IF NOT EXISTS export_metadata (\`key\` VARCHAR(64) NOT NULL PRIMARY KEY, \`value\` TEXT NOT NULL); CREATE TABLE IF NOT EXISTS result_attempts (result_id BIGINT NOT NULL, attempt_number INT NOT NULL)"
          docker compose run --rm flyway migrate
          docker compose run --rm -e FLYWAY_LOCATIONS=filesystem:/flyway/migrations/results \
            -e FLYWAY_TABLE=flyway_schema_history_results flyway migrate
          node scripts/sync-wca-export.mjs --force --raw-only \
            --sql-path="/tmp/wca-export-cache/wca-export-${{ inputs.export_date }}.sql.zip" \
            --canonical-export-date="${{ inputs.export_value }}"

          for group in $(printf '%s' "$BUILD_GROUPS" | tr ',' ' '); do
            destination="/tmp/restored/$group"
            mkdir -p "$destination"
            ref=$(jq -r --arg group "$group" '.[$group].ref // empty' /tmp/available-artifacts.json)
            digest=$(jq -r --arg group "$group" '.[$group].digest // empty' /tmp/available-artifacts.json)
            if [ -z "$digest" ]; then
              fingerprint=$(jq -r --arg group "$group" '.groups[$group].artifactFingerprint' /tmp/fingerprints.json)
              tagged_ref="ghcr.io/${owner}/wcarankings-projection-${group}:${fingerprint}"
              digest=$(oras manifest fetch --descriptor "$tagged_ref" | jq -r '.digest')
              ref="$tagged_ref"
            fi
            repository=${ref%%:*}
            oras pull "${repository}@${digest}" -o "$destination"
            node scripts/projection-release-artifact.mjs verify \
              --directory="$destination" --groups="$group" \
              --export-id="${{ inputs.export_value }}" \
              --fingerprints-file=/tmp/fingerprints.json
            metadata=$(find "$destination" -maxdepth 1 -name '*-projection-transfer.json' -print -quit)
            archive=$(jq -r '.archiveFile' "$metadata")
            transfer_directory="/tmp/transfer-$group"
            mkdir -p "$transfer_directory"
            tar -xzf "$destination/$archive" -C "$transfer_directory"
            DATABASE_NAME_OVERRIDE="$MYSQL_DATABASE" node scripts/import-projection-transfer.mjs \
              --directory="$transfer_directory" --metadata="$metadata" --concurrency=2
          done
          node scripts/publish-projection-transfer.mjs --hydrate \
            --groups="$BUILD_GROUPS" --expected-export-date="${{ inputs.export_value }}"

      - name: Run ranking scroll benchmark
        env:
          DATABASE_STATEMENT_TIMEOUT_MS: 60000
          DEPLOYED_MAIN_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          docker build --tag wcarankings-app:projection-benchmark .
          docker tag wcarankings-app:projection-benchmark wcarankings-app:latest
          DATABASE_URL="mysql://$MYSQL_USER:$MYSQL_PASSWORD@db:3306/$MYSQL_DATABASE" \
            DATABASE_STATEMENT_TIMEOUT_MS=60000 \
            DEPLOYED_MAIN_SHA="$DEPLOYED_MAIN_SHA" \
            docker compose up --detach app
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker compose logs app; exit 1; fi
            sleep 2
          done
          pnpm run benchmark:ranking-scroll -- \
            --target=http://127.0.0.1:3000 \
            --report-dir="$BENCHMARK_REPORT_DIR" \
            --label=projection-build

      - name: Upload ranking scroll benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-scroll-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-reports/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean runner database
        if: always()
        run: docker compose down --volumes --remove-orphans
