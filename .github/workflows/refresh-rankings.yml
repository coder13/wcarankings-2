name: Refresh Ranking Data

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve and cache the latest WCA export without changing production.
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: Rebuild and publish every projection group.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 5 * * *"

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  resolve_approved_data_tools:
    uses: ./.github/workflows/resolve-approved-data-tools.yml
    secrets: inherit

  plan_projections:
    needs: resolve_approved_data_tools
    uses: ./.github/workflows/plan-projections.yml
    with:
      ref: ${{ needs.resolve_approved_data_tools.outputs.source_sha }}
      force_rebuild: ${{ inputs.force_rebuild == true }}
    secrets: inherit

  build_projections:
    needs:
      - resolve_approved_data_tools
      - plan_projections
    uses: ./.github/workflows/build-projections.yml
    with:
      ref: ${{ needs.resolve_approved_data_tools.outputs.source_sha }}
      export_date: ${{ needs.plan_projections.outputs.export_date }}
      export_value: ${{ needs.plan_projections.outputs.export_value }}
      groups: ${{ needs.plan_projections.outputs.groups }}
      fingerprints: ${{ needs.plan_projections.outputs.fingerprints }}
      cache_only: ${{ inputs.dry_run == true }}
      include_raw: ${{ needs.plan_projections.outputs.raw_required == 'true' }}
    secrets: inherit

  deploy_projections:
    if: >-
      inputs.dry_run != true
      && needs.plan_projections.outputs.required == 'true'
      && needs.build_projections.result == 'success'
    needs:
      - plan_projections
      - build_projections
      - resolve_approved_data_tools
    uses: ./.github/workflows/deploy-projections.yml
    with:
      ref: ${{ needs.resolve_approved_data_tools.outputs.source_sha }}
      artifact_name: ${{ needs.build_projections.outputs.artifact_name }}
      manifest_sha256: ${{ needs.build_projections.outputs.manifest_sha256 }}
      groups: ${{ needs.plan_projections.outputs.groups }}
      export_date: ${{ needs.plan_projections.outputs.export_date }}
      export_value: ${{ needs.plan_projections.outputs.export_value }}
      production_export_value: ${{ needs.plan_projections.outputs.production_export_value }}
      source_sha: ${{ needs.build_projections.outputs.source_sha }}
      artifact_run_id: ${{ needs.build_projections.outputs.artifact_run_id }}
      artifact_id: ${{ needs.build_projections.outputs.artifact_id }}
      data_tools_image: ${{ needs.resolve_approved_data_tools.outputs.data_tools_image }}
    secrets: inherit
